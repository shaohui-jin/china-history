id: zhongguo-gongchandang-diyici-gangling
title: 中国共产党第一个纲领
volume: 中国共产党第一次全国代表大会通过
author: 中国共产党第一次全国代表大会
composed: 公元 1921 年 7 月
type: modern
quote: 一、我们的党定名为「中国共产党」。二、我们的党的纲领如下：（1）革命军队必须与无产阶级一起推翻资本家阶级的政权，必须援助工人阶级，直到社会阶级区分消除的时候；（2）直至阶级斗争结束为止，即直到社会的阶级区分消灭为止，承认无产阶级专政；（3）消灭资本家私有制，没收机器、土地、厂房和半成品等生产资料，归社会公有。
note: 中共一大通过的纲领，原件为俄文与英文，中文原件已佚，现存译本。三条纲领的核心是「无产阶级专政」与「消灭资本家私有制」——这是照搬共产国际二大的标准表述，而非对中国国情的分析。纲领未提反帝反封建，也未提农民问题；这两点要到二大（1922）才补上。一份 1921 年的文件缺少 1922 年才有的内容，正说明革命纲领是逐步调整的，不是一开始就完备。

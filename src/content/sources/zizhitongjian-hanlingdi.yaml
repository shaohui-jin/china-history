id: zizhitongjian-hanlingdi
title: 资治通鉴
volume: 卷五十七·汉纪四十九·灵帝熹平四年至光和二年
author: 司马光等
composed: 公元 1084 年
quote: 春，三月，诏诸儒正《五经》文字，刻石立于太学门外。……初，帝为侯时，常苦家贫，及即位，每叹桓帝不能作家居，故聚为私藏。……宦官讽司隶校尉段颎捕系太学诸生千余人。
note: 《通鉴》把石经与党锢编在同三卷之内，形成一种对照：一边是朝廷主持的正定经文、刻石太学，一边是同一位皇帝治下宦官捕系太学生千余人。司马光的编排本身就是判断——文化建设的姿态与政治镇压的现实，在同一个时代并存。太学生既是石经的读者，也是党锢的对象。

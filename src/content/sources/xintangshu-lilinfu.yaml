id: xintangshu-lilinfu
title: 新唐书
volume: 卷二二三上·奸臣传上·李林甫
author: 欧阳修等
composed: 约公元 1060 年
quote: 林甫居相位凡十九年，固宠市权，蔽欺天子耳目。……林甫善养君欲，自是帝深居燕适，沈蛊衽席，主德衰矣。……故事，宰相不兼领节度。林甫疾儒臣以边劳任宰相，欲杜其本，以久己权，即说帝曰：「以陛下雄材，国家富强，而夷狄未灭者，繇文吏为将，惮矢石，不身先。不如用蕃将，彼生而雄，养马上，长行阵，天性然也。」帝然之，故安禄山、哥舒翰等皆以节度使兼将相。
note: 《新唐书》把「专用蕃将」的决策明确归到李林甫的政治动机上，是安史之乱制度成因最直接的记载。

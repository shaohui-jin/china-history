id: shiji-wutaibo
title: 史记
volume: 卷三十一·吴太伯世家·阖庐至夫差
author: 司马迁
composed: 约公元前 91 年
quote: 阖庐病伤而死。阖庐使立太子夫差，谓曰：「尔而忘句践杀汝父乎？」对曰：「不敢忘！」三年，乃报越。……（夫差）十四年春，吴王北会诸侯于黄池，欲霸中国以全周室。……越王句践乃率其众以袭吴。
note: 《吴太伯世家》是《史记》三十世家中排第一的，因为「太伯让国」被视为「至德」。但实际上本篇的主体写的是吴国的强盛与覆亡：阖庐伤于越、夫差复仇、北上黄池争霸、越人乘虚袭吴。司马迁把一个「让」的故事，写成了一个「争」的结局。

id: jiutangshu-yangyan
title: 旧唐书
volume: 卷一百一十八·杨炎传·两税法
author: 刘昫等
composed: 约公元 945 年
type: classic
quote: 炎上疏曰：「……迨至德之后，天下兵起，始以兵役，因之饥疠，征求运输，百役并作，人户凋耗，版图空虚。……是以天下残瘁，荡为浮人，乡居地著者百不四五。……臣请作两税法，以一其名。凡百役之费，一钱之敛，先度其数而赋于人，量出以制入。户无主客，以见居为簿；人无丁中，以贫富为差。不居处而行商者，在所郡县税三十之一，度所与居者均，使无侥利。居人之税，秋夏两征之，俗有不便者正之。」
note: 两税法的原始设计，出自杨炎的奏疏。四个要点值得注意：一是「量出以制入」——先算支出再定税额，这与量入为出的传统相反；二是「户无主客，以见居为簿」——取消主户客户之分，按现居登记；三是「人无丁中，以贫富为差」——按资产而不是丁口征税，这是从人头税转向财产税的关键；四是「秋夏两征之」——一年两次，与农业收获季节配合，两税法之名由此而来。

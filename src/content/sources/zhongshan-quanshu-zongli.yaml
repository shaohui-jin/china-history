id: zhongshan-quanshu-zongli
title: 孙中山全集
volume: 第六卷·临时大总统誓词与宣言
author: 孙中山
composed: 公元 1912 年
type: modern
quote: 倾覆满洲专制政府，巩固中华民国，图谋民生幸福，此国民之公意，文实遵之，以忠于国，为众服务。至专制政府既倒，国内无变乱，民国卓立于世界，为列邦公认，斯时文当解临时大总统之职。谨以此誓于国民。
note: 1912 年 1 月 1 日孙中山就任中华民国临时大总统时的誓词。文本极短，但结构完整：先说目的（倾覆专制、巩固民国、图谋民生），再说来源（国民之公意），再说退任条件（专制既倒、无变乱、为列邦公认）。宣誓就职本身即是共和政体与帝制的分野——权力来自国民之托，且附有退任条件。

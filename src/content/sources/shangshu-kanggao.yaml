id: shangshu-kanggao
title: 尚书
volume: 康诰
author: 旧题孔安国传
composed: 西周初年成篇，今本经东晋人整理
quote: 惟乃丕显考文王，克明德慎罚，不敢侮鳏寡，庸庸，祗祗，威威，显民。用肇造我区夏，越我一二邦，以修我西土。惟时怙冒，闻于上帝，帝休。天乃大命文王，殪戎殷，诞受厥命越厥邦厥民。
note: 「克明德慎罚」是周公在《康诰》中对文王之德的概括，也是「明德慎罚」这一政治命题的原始出处。「天乃大命文王，殪戎殷」——天命授予文王以灭殷的使命，这是周人对自己政权合法性的正面陈述。需要注意的是：文王本人并未灭殷，灭殷的是武王；这里的表述是把两代人的功业记在受命者名下。

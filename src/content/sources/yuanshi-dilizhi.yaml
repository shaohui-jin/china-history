id: yuanshi-dilizhi
title: 元史
volume: 卷五十八·地理志一·中书省与行中书省
author: 宋濂等
composed: 约公元 1370 年
type: classic
quote: 自封建变为郡县，有天下者，汉、隋、唐、宋为盛，然幅员之广，咸不逮元。……元东南所至不下汉、唐，而西北则过之，有难以里数限者矣。……立中书省一，行中书省十有一：曰岭北，曰辽阳，曰河南，曰陕西，曰四川，曰甘肃，曰云南，曰江浙，曰江西，曰湖广，曰征东。
note: 《元史·地理志》序的两个要点。一是疆域的比较：「自封建变为郡县，有天下者，汉、隋、唐、宋为盛，然幅员之广，咸不逮元。」元代是中国历史上疆域最广的统一王朝。二是行省的数目与名称：一为中书省，十一为行中书省。这十一个名称，与今日的省名有着清晰的对应关系——河南、陕西、四川、甘肃、云南、江西、湖广，至今仍是省级行政区的名称。

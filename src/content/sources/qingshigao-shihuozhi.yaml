id: qingshigao-shihuozhi
title: 清史稿
volume: 卷一百二十一·食货志二·赋役
author: 赵尔巽等
composed: 约公元 1928 年
type: classic
quote: 雍正元年，诏天下编审人丁，各省丁额，以康熙五十年为准，其后滋生人丁，永不加赋。至是，又以各直省丁银，均摊入地亩征收，谓之摊丁入亩。凡地赋一两，摊丁银二钱有奇，各省轻重不等。自是丁银与地赋合而为一，民纳地丁之外，别无徭役矣。
note: 摊丁入亩的记载，两件事要分开看。一是康熙五十年的「滋生人丁，永不加赋」——把丁额固定在 1711 年的数字上，此后新增人口不再加税，这已经断了丁税增长的机制。二是雍正元年的「摊丁入亩」——把丁银总数摊入地亩，从此「民纳地丁之外，别无徭役」。前者是冻结，后者是并入；两步合起来，延续两千年的人头税才真正消失。这一变化的意义常被低估：此后的赋税完全以土地为依据，人口不再是被征税的对象。

id: hanshu-quyizhuan
title: 汉书
volume: 卷八十四·翟方进传附翟义
author: 班固
composed: 约公元 82 年
quote: 义曰：「新都侯摄天子位，号令天下，故择宗室幼稚者以为孺子，依讬周公辅成王之义，且以观望，必代汉家。」……义遂与东郡都尉刘宇、严乡侯刘信、信弟武平侯刘璜结谋。及举兵，义自号大司马柱天大将军，以东平王傅苏隆为丞相，中尉皋丹为御史大夫，移檄郡国，言莽鸩杀孝平皇帝，矫摄尊号，今天子已立，共行天罚。郡国皆震。
note: 翟义起兵的檄文内容值得注意：他指控王莽「鸩杀孝平皇帝」——这是汉书中唯一明确记载平帝被毒杀的地方（《平帝纪》只说「帝崩于未央宫」）。「矫摄尊号」则直指居摄的非法性。「郡国皆震」四字说明起兵初期声势不小，但最终为莽所破。这条记载的价值在于：它保存了反对派的声音，而《王莽传》是站在胜利者立场的叙述。

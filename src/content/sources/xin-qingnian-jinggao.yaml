id: xin-qingnian-jinggao
title: 新青年
volume: 第一卷第一号·敬告青年
author: 陈独秀
composed: 公元 1915 年 9 月
type: modern
quote: 自主的而非奴隶的；进步的而非保守的；进取的而非退隐的；世界的而非锁国的；实利的而非虚文的；科学的而非想象的。……国人而欲脱蒙昧时代，羞为浅化之民也，则急起直追，当以科学与人权并重。
note: 《敬告青年》是《新青年》（初名《青年杂志》）的发刊之作，六条主张以排比形式列出。「当以科学与人权并重」——「科学」与「民主」（人权）此后成为新文化运动的两面旗帜。需要注意的是，这段文字的论证方式极为简洁：每一条都以「XX 的而非 XX 的」的对照形式给出，不加论证。这种文体本身就是五四一代的典型：先立标准，再谈细节。

id: sanguozhi-guandu
title: 三国志
volume: 卷一·魏书·武帝纪·官渡
author: 陈寿
composed: 约公元 297 年
type: classic
quote: 八月，绍连营稍前，依沙塠为屯，东西数十里。公亦分营与相当，合战不利。时公兵不满万，伤者十二三。绍复进临官渡，起土山地道。公亦于内作之，以相应。绍射营中，矢如雨下，行者皆蒙楯，众大惧。时公粮少，与荀彧书，议欲还许。……冬十月，绍遣车运谷，使淳于琼等五人将兵万余人送之，宿绍营北四十里。……公乃留曹洪守，自将步骑五千人夜往，会明至。琼等望见公兵少，出陈门外。公急击之，琼退保营，遂攻之。绍遣骑救琼。……大破之，斩琼等，尽燔其粮谷宝货。
note: 官渡之战的正面记载。三个细节值得留意：一是双方兵力，「公兵不满万，伤者十二三」，而袁绍「众十余万」；二是曹操一度想撤，「与荀彧书，议欲还许」，荀彧回信劝其坚守；三是决胜的一击不在正面战场，而在乌巢烧粮——「尽燔其粮谷宝货」。一场以少胜多的战役，胜负手是后勤，不是阵战。

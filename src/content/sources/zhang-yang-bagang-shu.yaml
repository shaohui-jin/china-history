id: zhang-yang-bagang-shu
title: 张杨八项主张通电
volume: 1936 年 12 月 12 日通电
author: 张学良、杨虎城
composed: 公元 1936 年 12 月 12 日
type: modern
quote: 东北沦亡，时逾五载，国权凌夷，疆土日蹙。淞沪协定屈辱于前，塘沽协定继之于后。……凡此种种，皆因蒋委员长误国政策所致。……（一）改组南京政府，容纳各党各派，共同负责救国。（二）停止一切内战。（三）立即释放上海被捕之爱国领袖。（四）释放全国一切政治犯。（五）开放民众爱国运动。（六）保障人民集会结社一切政治自由。（七）确实遵行总理遗嘱。（八）立即召开救国会议。
note: 西安事变当天张学良、杨虎城发出的通电，八项主张。第一条「容纳各党各派」与第二条「停止一切内战」是核心，其余多为政治自由与释放政治犯。开头直指「东北沦亡，时逾五载」——这是张的个人动机，也是他无法回避的旧账：五年前不抵抗的人就是他自己。这份通电因此既是兵谏，也是自我辩解。

id: mingshi-jishi-duomen
title: 明史纪事本末
volume: 卷三十五·南宫复辟
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 景泰八年春正月，景帝不豫。……石亨、张軏、曹吉祥、徐有贞等谋迎上皇。……夜四鼓，亨等率群从，叩南宫门。门锢，毁垣而入。上皇问：「卿等何为？」亨等曰：「请陛下复位。」遂掖上皇登辇，至奉天殿。……时百官候朝于午门外，闻殿上呼噪，方惊愕。须臾，鸣钟鼓，启诸门，百官入贺，始知上皇复位矣。
note: 夺门之变的完整记载。「门锢，毁垣而入」——南宫的门被锁死了，他们拆墙进去。「上皇问：卿等何为？」——朱祁镇被软禁七年，半夜墙塌了进来一群人，他的第一反应是问「你们要干什么」。「百官候朝于午门外……始知上皇复位矣」——满朝文武在午门外等着上朝，听到钟鼓才知道皇帝换人了。一段政变，从开始到结束不过几个时辰。

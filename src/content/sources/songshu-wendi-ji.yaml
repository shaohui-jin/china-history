id: songshu-wendi-ji
title: 宋书
volume: 卷五·文帝纪·赞
author: 沈约
composed: 约公元 488 年
type: classic
quote: 太祖幼年特秀，顾无保傅之严，而天授和敏之姿，自禀君人之德。及正位南面，历年长久，纲维备举，条禁明密，罚有恒科，爵无滥品。故能内清外晏，四海谧如也。昔汉氏东京，常称建武、永平故事，自兹厥后，亦每以元嘉为言，斯固盛矣。
note: 元嘉之治的官方评价。「纲维备举，条禁明密，罚有恒科，爵无滥品」——四条都是制度性的：法令完备、赏罚有常、不滥封爵。沈约把元嘉与东汉的建武、永平并称，认为此后凡言盛世必称元嘉。这一评价影响了后世对刘宋前期的整体印象。但需注意：元嘉之治只维持了约三十年，元嘉二十七年（450）的北伐惨败，使国力大损，刘宋从此由盛转衰。

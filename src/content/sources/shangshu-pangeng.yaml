id: shangshu-pangeng
title: 尚书
volume: 盘庚上
author: 旧题孔安国传
composed: 西周初年成篇，今本经东晋人整理
type: classic
quote: 盘庚迁于殷，民不适有居，率吁众戚出矢言。曰：「我王来，既爰宅于兹，重我民，无尽刘。不能胥匡以生，卜稽曰其如台？先王有服，恪谨天命，兹犹不常宁；不常厥邑，于今五邦。今不承于古，罔知天之断命，矧曰其克从先王之烈？若颠木之有由蘖，天其永我命于兹新邑，绍复先王之大业，厎绥四方。」
note: 盘庚迁殷的当时文献，是《尚书》中最可信的篇章之一。「若颠木之有由蘖」——像倒下的树又长出新芽，这是盘庚用来比喻迁都求生的话。全篇记的是迁都引发的巨大争议：民众不愿迁，贵族反对，盘庚反复训诫。这一场争论之所以被完整记录，正说明它不是一次平静的迁徙，而是一场政治危机。

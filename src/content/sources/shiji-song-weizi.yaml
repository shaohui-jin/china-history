id: shiji-song-weizi
title: 史记
volume: 卷三十八·宋微子世家·襄公
author: 司马迁
composed: 约公元前 91 年
quote: 襄公与楚成王战于泓。楚人未济，目夷曰：「彼众我寡，及其未济击之。」公不听。已济未陈，又曰：「可击。」公曰：「待其已陈。」陈成，宋人击之。宋师大败，襄公伤股。……太史公曰：襄公既败于泓，而君子或以为多，伤中国阙礼义，褒之也，宋襄之有礼让也。
note: 司马迁在篇末引「君子或以为多」——即有人认为襄公虽败而可褒，因为他守礼。但接着一句「伤中国阙礼义」点出这层褒扬的真实语境：司马迁所处的汉武帝时代，礼义被认为已废，于是宋襄公成了追慕的对象。《史记》的评价，往往要连着时代去看。

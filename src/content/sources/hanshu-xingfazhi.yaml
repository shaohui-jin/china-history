id: hanshu-xingfazhi
title: 汉书
volume: 卷二十三·刑法志·缇萦救父与文景刑制改革
author: 班固
composed: 约公元 82 年
type: classic
quote: 即位十三年，齐太仓令淳于公有罪当刑，诏狱逮系长安。淳于公无男，有五女，当行会逮，骂其女曰：「生子不生男，缓急非有益！」其少女缇萦，自伤悲泣，乃随其父至长安，上书曰：「妾父为吏，齐中皆称其廉平，今坐法当刑。妾伤夫死者不可复生，刑者不可复属，虽后欲改过自新，其道亡繇也。妾愿没入为官婢，以赎父刑罪，使得自新。」书奏天子，天子怜悲其意，遂下令曰：「……其除肉刑，有以易之。」
note: 文景时期刑制改革的起因，出自缇萦救父。《汉书·刑法志》这一段的价值在于它记录了改革的实际动因：不是出于法理，而是出于一个少女的上书打动皇帝。缇萦的话「死者不可复生，刑者不可复属」——人死了不能复活，受了肉刑不能再长出肢体——是中国最早的废除肉刑的论证。文帝因此下令废除黥、劓、刖等肉刑，改为笞、杖、徒。这一改革被后世视为中国古代刑罚文明化的重要一步。

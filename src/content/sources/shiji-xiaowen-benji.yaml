id: shiji-xiaowen-benji
title: 史记
volume: 卷十·孝文本纪
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 孝文帝从代来，即位二十三年，宫室苑囿狗马服御无所增益，有不便，辄弛以利民。尝欲作露台，召匠计之，直百金。上曰：「百金中民十家之产，吾奉先帝宫室，常恐羞之，何以台为！」上常衣绨衣，所幸慎夫人，令衣不得曳地，帏帐不得文绣，以示敦朴，为天下先。……专务以德化民，是以海内殷富，兴于礼义。
note: 汉文帝节俭的最具体记载。「百金中民十家之产」——一座露台的造价等于十户中等人家的家产，于是他决定不建。这一笔账在《史记》里被完整记下，说明司马迁认为它是理解文帝之治的关键。「上常衣绨衣」「令衣不得曳地」，一个皇帝穿粗厚丝织品，让宠妃的裙子不拖地——这些细节共同构成了「文景之治」的物质基础：轻徭薄赋的前提是皇室开支的压缩。

id: hanshu-jingdi
title: 汉书
volume: 卷五·景帝纪
author: 班固
composed: 约公元 82 年
type: classic
quote: 三年春正月，吴王濞、胶西王卬、楚王戊、赵王遂、济南王辟光、菑川王贤、胶东王雄渠皆举兵反。诏曰：「……吴王濞背德反义，诱受天下亡命罪人，乱天下币，称病不朝二十余年，有司数请濞罪，孝文皇帝宽之，欲其改行为善。今乃与楚王戊、赵王遂、胶西王卬、济南王辟光、菑川王贤、胶东王雄渠约从反，为逆无道，起兵以危宗庙，贼杀大臣及汉使者，迫劫万民，煞伤无罪，烧残民家，掘其丘垄，甚为虐暴。」……既破七国，乃诏曰：「诸侯王不得复治国，天子为置吏。」
note: 《汉书·景帝纪》记七国之乱的两道诏书。前一道列数七国之罪，后一道是平乱之后的收权诏：「诸侯王不得复治国，天子为置吏」。这十四个字比整场战争更重要——它把诸侯王的行政权彻底收归中央，此后的诸侯王只剩封号与食邑。班固把这道诏书放在纪中，说明他认为这才是景帝朝的关键。

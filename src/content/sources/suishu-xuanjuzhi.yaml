id: suishu-xuanjuzhi
title: 隋书
volume: 卷二十六·选举志
author: 魏征等
composed: 约公元 656 年
type: classic
quote: 自后周以降，选举之法，多循魏制。……及高祖践阼，百度伊新，乃诏京官五品以上，及总管、刺史，并以志行修谨、清平干济二科举人。……炀帝即位，又变前法，始建进士科，又制百官不得计考增级。
note: 《隋书·选举志》记隋代选举制度的演变。两条关键信息：一是文帝开皇年间以「志行修谨」「清平干济」二科举人，这还是察举式的推荐，不是考试；二是「炀帝即位，又变前法，始建进士科」——进士科的设立被系于炀帝，这是科举制起源的标准说法。需要注意的是，「始建进士科」四字并没有说明它是否用考试取士，而这一点正是「科举」与「察举」的分水岭。

id: guoyu-zhouyu-jiyu
title: 国语
volume: 周语上·祭公谏穆王征犬戎、密康公母论共王
author: 相传左丘明撰
composed: 战国前期
quote: 穆王将征犬戎，祭公谋父谏曰：「不可。先王耀德不观兵。夫兵戢而时动，动则威；观则玩，玩则无震。」……王不听，遂征之，得四白狼四白鹿以归。自是荒服者不至。……恭王游于泾上，密康公从，有三女奔之。其母曰：「必致之于王。夫兽三为群，人三为众，女三为粲。王田不取群，公行下众，王御不参一族。夫粲，美之物也。众以美物归女，而何德以堪之？王犹不堪，况尔小丑乎？」康公不献。一年，王灭密。
note: 《国语·周语上》开篇两段，正好覆盖穆王与共王两代。祭公谋父的谏辞提出「先王耀德不观兵」——先王彰显德行而不炫耀武力，这是西周礼制政治的核心表述。穆王不听，「得四白狼四白鹿以归。自是荒服者不至」——战果只有四狼四鹿，代价是远方诸侯不再来朝。密康公一段则记共王灭密，是王室对畿内诸侯动用武力的一个例证。

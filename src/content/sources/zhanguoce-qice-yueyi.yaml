id: zhanguoce-qice-yueyi
title: 战国策
volume: 燕策二·昌国君乐毅为燕昭王合五国之兵而攻齐
author: 刘向辑
composed: 西汉末辑成，材料出战国
type: classic
quote: 昌国君乐毅为燕昭王合五国之兵而攻齐，下七十余城，尽郡县之以属燕。三城未下，而燕昭王死。惠王即位，用齐人反间，疑乐毅，而使骑劫代之将。乐毅奔赵。……齐田单欺诈骑劫，卒败燕军，复收七十城以复齐。燕王悔，惧赵用乐毅乘燕之敝以伐燕，燕王乃使人让乐毅，且谢之曰：「先王举国而委将军，将军为燕破齐，报先王之仇，天下莫不振动，寡人岂敢一日而忘将军之功哉！会先王弃群臣，寡人新即位，左右误寡人。」
note: 《战国策·燕策二》所记乐毅破齐的梗概，与《史记》乐毅列传互补。「三城未下，而燕昭王死」——功败垂成的关键在于人事更替，不在军事。惠王中反间计而以骑劫代乐毅，田单遂以火牛阵破燕复国。这一段与《报燕惠王书》合读，能看到战国政治的一条通则：君主的信任，往往比战场上的胜利更难得，也更容易失去。

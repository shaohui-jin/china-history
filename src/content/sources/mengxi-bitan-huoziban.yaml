id: mengxi-bitan-huoziban
title: 梦溪笔谈
volume: 卷十八·技艺·活板
author: 沈括
composed: 约公元 1088 年
type: classic
quote: 板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。庆历中，有布衣毕昇，又为活板。其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。先设一铁板，其上以松脂、蜡和纸灰之类冒之。欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之，药稍熔，则以一平板按其面，则字平如砥。若止印三二本，未为简易；若印数十百千本，则极为神速。
note: 活字印刷术唯一的原始记载。毕昇是「布衣」，一个没有官职的平民，他的发明靠沈括的记录才得以流传——而沈括本人并没有推广它。「若止印三二本，未为简易；若印数十百千本，则极为神速」——沈括写得很实在：活字的好处在于批量，小批量反而不如雕版。这一判断说明，技术优势总是有条件的。毕昇的胶泥活字在当时并未广泛使用，真正的普及要到元代王祯的木活字与明代的铜活字。

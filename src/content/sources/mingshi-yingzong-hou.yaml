id: mingshi-yingzong-hou
title: 明史
volume: 卷十二·英宗后纪·赞
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 景帝八年正月，上皇复辟。……初，上皇居南宫，景帝欲绝其望，撤南宫树木。会景帝不豫，石亨、徐有贞等谋迎上皇复位。夜四鼓，石亨等率兵千人，叩南宫门，毁垣而入，掖上皇登奉天殿。……上皇既复辟，废景帝为郕王，寻薨。……英宗承仁、宣之业，海内富庶，朝野清晏。独以王振擅权，遂至土木之蒙尘。乃复辟而后，犹追念不置，何其惑也！
note: 夺门之变的记载。「夜四鼓，石亨等率兵千人，叩南宫门，毁垣而入，掖上皇登奉天殿」——一场政变的全部过程，只用了这一句。「毁垣而入」四个字说明南宫的围墙是被拆开的，被软禁的皇帝连门都不能走。史官最后的评论「独以王振擅权，遂至土木之蒙尘。乃复辟而后，犹追念不置，何其惑也」，点出英宗一生的两个致命处：信王振、念王振。

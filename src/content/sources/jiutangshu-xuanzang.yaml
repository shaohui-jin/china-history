id: jiutangshu-xuanzang
title: 旧唐书
volume: 卷一九一·方伎传·僧玄奘
author: 刘昫等
composed: 约公元 945 年
quote: 僧玄奘，姓陈氏，洛州偃师人。大业末出家，博涉经论。尝谓翻译者多有讹谬，故就西域，广求异本以参验之。贞观初，随商人往游西域。玄奘既辩博出群，所在必为讲释论难，蕃人远近咸尊伏之。在西域十七年，经百余国，悉解其国之语，仍采其山川谣俗，土地所有，撰《西域记》十二卷。
note: 《玄奘传》附于《方伎传》，篇幅简短，然「在西域十七年，经百余国，悉解其国之语」数语，概括了其行程规模。玄奘本人的《大唐西域记》是更详细的原始材料。

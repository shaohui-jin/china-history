id: jiutangshu-wuzong
title: 旧唐书
volume: 卷十八上·武宗本纪
author: 刘昫等
composed: 约公元 945 年
quote: 会昌五年秋七月庚子，敕并省天下佛寺。中书门下条奏：「据令式，诸上州以上，许置寺观一所，其上都、东都两街各留十寺，每寺留僧十人。天下节度、观察使治所及同、华、商、汝州各留一寺，分为三等：上等留僧二十人，中等留十人，下等五人。余僧及尼并大秦穆护、祆僧皆勒归俗。」……其天下所拆寺四千六百余所，还俗僧尼二十六万五百人，收充两税户，拆招提、兰若四万余所，收膏腴上田数千万顷，收奴婢为两税户十五万人。
note: 会昌灭佛的官方记录，数字极为具体：拆寺四千六百余所、还俗僧尼二十六万余人、拆招提兰若四万余所、收田数千万顷、收奴婢十五万人。这些数字的意义在于它们指向的不是信仰问题，而是财政问题——寺院占有大量土地与人口，且不纳税、不服役。武宗灭佛的核心动机，从这份账簿式的敕令里可以看得很清楚。

id: shiji-kongzi-shijia-2
title: 史记
volume: 卷四十七·孔子世家·相鲁
author: 司马迁
composed: 约公元前 91 年
quote: 定公十年春，及齐平。夏，齐大夫黎锄言于景公曰：「鲁用孔丘，其势危齐。」乃使使告鲁为好会，会于夹谷。……孔子摄相事。……景公惧而动，知义不若，归而大恐，告其群臣曰：「鲁以君子之道辅其君，而子独以夷狄之道教寡人，使得罪于鲁君，为之奈何？」有司进对曰：「君子有过则谢以质，小人有过则谢以文。君若悼之，则谢以质。」于是齐侯乃归所侵鲁之郓、汶阳、龟阴之田以谢过。
note: 夹谷之会是孔子政治生涯中最具体的一次外交胜利。齐国本欲以「夷狄之乐」羞辱鲁君，孔子以礼斥退，齐景公反而「惧而动」，归还三处侵地。司马迁写此事，重点不在孔子的辩才，而在「知义不若」四字——齐侯认输，不是打不过，是道理上站不住。

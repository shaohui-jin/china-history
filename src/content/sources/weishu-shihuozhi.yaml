id: weishu-shihuozhi
title: 魏书
volume: 卷一百一十·食货志·均田
author: 魏收
composed: 约公元 554 年
type: classic
quote: 九年，下诏均给天下民田：诸男夫十五以上，受露田四十亩，妇人二十亩，奴婢依良。丁牛一头受田三十亩，限四牛。所授之田率倍之，三易之田再倍之，以供耕作及还受之盈缩。诸民年及课则受田，老免及身没则还田。奴婢、牛随有无以还受。诸桑田不在还受之限，但通入倍田分。……诸麻布之土，男夫及课，别给麻田十亩，妇人五亩，奴婢依良，皆从还受之法。
note: 均田制最原始的文本，北魏太和九年（485）诏。「露田」是要还的（种粮），「桑田」是永业不必还（种麻桑），这一区分是均田制的核心设计：国家只控制口分田的循环分配，不动私有的永业田。「奴婢依良」「丁牛一头受田三十亩」——受田对象包括奴婢与耕牛，说明这套制度的设计前提是豪强地主的存在，它承认既成事实，然后在此框架内把无主荒地分给自耕农。

id: shiji-wei-shijia
title: 史记
volume: 卷四十四·魏世家·文侯
author: 司马迁
composed: 约公元前 91 年
quote: 魏文侯谓李克曰：「先生尝教寡人曰『家贫则思良妻，国乱则思良相』。今所置非成则璜，二子何如？」李克对曰：「臣闻之，卑不谋尊，疏不谋戚。臣在阙门之外，不敢当命。」文侯曰：「先生临事勿让。」李克曰：「君不察故也。居视其所亲，富视其所与，达视其所举，穷视其所不为，贫视其所不取，五者足以定之矣，何待克哉！」……魏文侯受子夏经艺，客段干木，过其闾，未尝不轼也。秦尝欲伐魏，或曰：「魏君贤人是礼，国人称仁，上下和合，未可图也。」
note: 《魏世家》记魏文侯两件奠定魏国霸权的事：一是卜相之议（李克论「居视其所亲，富视其所与」），二是礼贤（受子夏经艺、过段干木之闾而轼）。后一段最值得注意：秦人因此判断「魏君贤人是礼，国人称仁」，认为不可伐。战国初年的国力评估，把「礼贤」算作国防要素。

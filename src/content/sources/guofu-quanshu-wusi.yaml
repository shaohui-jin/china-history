id: guofu-quanshu-wusi
title: 中国国民党第一次全国代表大会宣言
volume: 孙中山全集第九卷
author: 孙中山
composed: 公元 1924 年 1 月
type: modern
quote: 自欧战告终，列强之帝国主义，不但未减，且益加厉。巴黎和会，列强以山东权利让与日本，我国民奋起抗争，是为五四运动。然此运动，仅为国民自觉之始，未能根本改造，故革命之责任，尤在吾党。
note: 孙中山 1924 年在国民党一大宣言中对五四的定位，值得注意的有两点。一是承认「我国民奋起抗争，是为五四运动」，把五四纳入国民革命的正统叙述；二是紧接着的判断「仅为国民自觉之始，未能根本改造」——他认为五四只是觉醒，不足以完成革命，所以国民党的责任还在。这是从革命党的角度对五四的收编，也是国民党后来与五四传统关系复杂的起点。

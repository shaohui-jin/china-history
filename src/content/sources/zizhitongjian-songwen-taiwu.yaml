id: zizhitongjian-songwen-taiwu
title: 资治通鉴
volume: 卷一百二十四·宋纪六·元嘉二十三年
author: 司马光等
composed: 公元 1084 年
type: classic
quote: 魏主与崔浩皆信重寇谦之，奉其道。浩素恶佛法，因言于魏主曰：「佛法虚诞，为世费害，宜悉除之。」……魏主从之，诏曰：「……自今以后，敢有事胡神及造形像泥人、铜人者，门诛。……有司宣告征镇诸军、刺史，诸有浮图形像及胡经，尽皆击破焚烧，沙门无少长悉坑之。」
note: 《通鉴》对太武帝灭佛的记载，与《魏书·释老志》可互补。两处差别值得注意：《魏书》把起因归于长安寺院的违法（藏弓矢、酿具、妇女），《通鉴》则强调崔浩「素恶佛法」的推动与诏令本身的严厉——「沙门无少长悉坑之」。一记起因，一记诏令，合起来才看得出这场法难的完整面貌。太武帝真君七年（446）的这道诏，是「三武一宗」法难的第一次。

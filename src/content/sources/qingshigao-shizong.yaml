id: qingshigao-shizong
title: 清史稿
volume: 卷九·世宗本纪
author: 赵尔巽等
composed: 约公元 1928 年
type: classic
quote: 雍正元年春正月，谕各省督抚清查亏空，限三年补足。……二年，山西巡抚诺岷请以通省耗羡提解存公，分给各官养廉。上允行之，遂为定制。……四年，设军需房于隆宗门内，后改军机处。军机大臣无定员，皆亲简，每日召对，承旨书谕。
note: 《清史稿·世宗本纪》对雍正朝的记载极为简练，三年之内完成的几件大事各占一行：清查亏空、耗羡归公、设军机处。「军机大臣无定员，皆亲简，每日召对，承旨书谕」——这十八字把军机处的性质说尽了：它不是决策机构，是皇帝与外界之间的传声系统。

id: jiutangshu-xuanzong
title: 旧唐书
volume: 卷十八下·宣宗本纪
author: 刘昫等
composed: 约公元 945 年
quote: 帝雅好儒士，留心贡举。有时微行人间，采听舆论，以观选士之得失。……每宰臣延英奏事，帝必肃然改容，拱手以听。……帝性明察沉断，用法无私，从谏如流，重惜官赏，恭谨节俭，惠爱民物。……十三年春正月，帝饵方士金丹，疽发于背，八月，崩于大明宫，年五十。
note: 《旧唐书》对宣宗的评价极高，用了一连串德目：「明察沉断，用法无私，从谏如流，重惜官赏，恭谨节俭，惠爱民物。」值得注意的是末句「饵方士金丹，疽发于背」——这位以「明察」著称的皇帝，最终死于对道士的轻信，与武宗如出一辙。唐代皇帝死于丹药者不止一人，这本身说明丹药与宫廷政治的关系远比个人信仰复杂。

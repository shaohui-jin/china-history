id: hanshu-shihuozhi
title: 汉书
volume: 卷二十四上·食货志上
author: 班固
composed: 约公元 82 年
quote: 李悝为魏文侯作尽地力之教，以为地方百里，提封九万顷，除山泽邑居参分去一，为田六百万亩，治田勤谨则亩益三升，不勤则损亦如之。地方百里之增减，辄为粟百八十万石矣。……善为国者，使民毋伤而农益劝。……是故善平籴者，必谨观岁有上中下孰。
note: 《汉书·食货志》是记述李悝经济政策最系统的文献，比《史记》详细得多。它保留了「尽地力之教」的具体算法：百里之地六百万亩，勤则每亩增三升，惰则减三升，一增减就是一百八十万石。这个计算方式很值得注意——它把农业政策变成了可量化的算术问题，而不是道德劝勉。后半段讲平籴法：把年成分上中下三等，按等级收购，使粮价平稳。

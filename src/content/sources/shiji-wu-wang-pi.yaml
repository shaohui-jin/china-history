id: shiji-wu-wang-pi
title: 史记
volume: 卷一百六·吴王濞列传·七国之乱
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 晁错为太子家令，得幸太子，数从容言吴过可削。数上书说孝文帝，文帝宽，不忍罚，以此吴日益横。及孝景帝即位，错为御史大夫，说上曰：「昔高帝初定天下，昆弟少，诸子弱，大封同姓……今吴王前有太子之郄，诈称病不朝，于古法当诛，文帝弗忍，因赐几杖。德至厚，当改过自新。乃益骄溢，即山铸钱，煮海水为盐，诱天下亡人，谋作乱。今削之亦反，不削之亦反。削之，其反亟，祸小；不削，反迟，祸大。」
note: 七国之乱的起因，出于晁错的削藩之议。「今削之亦反，不削之亦反。削之，其反亟，祸小；不削，反迟，祸大」——这段话的逻辑极清晰：叛乱是必然的，问题只是早与晚、大与小。晁错算准了这一点，却没算准自己会成为一个求和的条件。景帝斩他于东市，吴楚不退——这证明他的判断是对的，只是代价由他自己承担。

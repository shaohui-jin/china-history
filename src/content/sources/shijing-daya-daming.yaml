id: shijing-daya-daming
title: 诗经
volume: 大雅·大明
author: 无名氏
composed: 西周前期
quote: 明明在下，赫赫在上。天难忱斯，不易维王。天位殷適，使不挟四方。……维此文王，小心翼翼。昭事上帝，聿怀多福。厥德不回，以受方国。……有命自天，命此文王。于周于京，缵女维莘。
note: 「维此文王，小心翼翼。昭事上帝，聿怀多福」——《诗经》中文王形象的核心：不是征伐者，而是敬事上帝、德行无亏的人。「有命自天，命此文王」是周人「文王受命」说的诗体表述。需要注意的是，这首诗把文王之德与殷之失德对照来写，天命转移的逻辑就建立在这一对照之上。

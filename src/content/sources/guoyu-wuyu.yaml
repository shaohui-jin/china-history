id: guoyu-wuyu
title: 国语
volume: 吴语·越语上·勾践灭吴
author: 相传左丘明撰
composed: 战国前期
quote: 越王句践栖于会稽之上，乃号令于三军曰：「凡我父兄昆弟及国子姓，有能助寡人谋而退吴者，吾与之共知越国之政。」大夫种进对曰：「臣闻之贾人，夏则资皮，冬则资𫄨，旱则资舟，水则资车，以待乏也。夫虽无四方之忧，然谋臣与爪牙之士，不可不养而择也。」
note: 《国语·越语》记勾践困于会稽时的号令，与《史记》所记角度不同。《史记》重勾践返国后的自苦，《国语》重他在败局中的动员：谁能助我退吴，就与之共掌国政。文种的回答更值得注意——他用商人的囤积之道比喻养士：夏天备皮袄、冬天备细葛、旱时备船、涝时备车，都是「以待乏也」。谋臣与武士，也必须在无事时养着。这一比喻把「养士」从道德义务变成了投资逻辑。

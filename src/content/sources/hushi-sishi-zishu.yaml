id: hushi-sishi-zishu
title: 四十自述
volume: 自序
author: 胡适
composed: 公元 1933 年
type: modern
quote: 我在这十几年之中，从不曾完全抛弃我少年时代的「破除迷信，开通民智」的热心。但我到了美国之后，方才深深地感觉，一个国家的思想，是渐渐演进的，不是一蹴可几的。……我认清了这一点，方才敢说「多研究些问题，少谈些主义」。
note: 胡适对自己思想的回顾。「一个国家的思想，是渐渐演进的，不是一蹴可几的」——这句话解释了他与陈独秀分道的方法论根源：他在美国接受的实用主义教育，使他倾向于渐进改良。这与他 1919 年「多研究些问题，少谈些主义」的主张完全一致，也可以解释为什么他一生反对独断。

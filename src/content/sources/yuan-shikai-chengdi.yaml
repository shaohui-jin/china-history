id: yuan-shikai-chengdi
title: 袁世凯称帝
volume: 政府公报·民国四年十二月十二日
author: 袁世凯政府
composed: 公元 1915 年 12 月
type: modern
quote: 大总统袁世凯令：……前此各省公民，以国民公意，推戴大总统为中华帝国皇帝。……大总统再三谦让，而国民请求益坚。……兹特宣告：改中华民国四年为洪宪元年，大总统袁世凯即皇帝位。……中华民国之主权，仍属于国民全体。
note: 袁世凯称帝的官方文告。最值得注意的是一边宣告称帝、一边声明「中华民国之主权，仍属于国民全体」的矛盾——这份文告既想确立帝制，又想保留共和的名义。称帝的过程也有意思：先由「国民代表」推戴，袁世凯「再三谦让」，然后「国民请求益坚」——这是一套完整的劝进程序，模仿的是古代禅让。但当时的人并不买账：83 天后，袁世凯被迫取消帝制。

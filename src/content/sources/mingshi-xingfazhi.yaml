id: mingshi-xingfazhi
title: 明史
volume: 卷九十四·刑法志二
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 洪武十八年，诏尽逮天下积岁官吏为民害者，赴京师筑城。……时官吏有罪，笞以上，悉谪凤阳屯种。……（空印案）考前代，地方官岁终诣京师核钱谷，以道远，预持空印文书，遇部驳即改。帝疑有奸，大怒，论诸长吏死，佐贰榜百戍边。宁海人郑士利上书讼其冤，帝怒，下狱。……（郭桓案）户部侍郎郭桓坐盗官粮，株连直省诸官吏，系死者数万人。
note: 明初大案的官方记载。「空印案」的起因是地方官为了方便，预先携带盖好印的空白文书赴京核账，遇部驳即改。朱元璋疑其有奸，论死大量官员。郑士利上书讼冤，反被下狱。「郭桓案」株连「直省诸官吏，系死者数万人」。这两段说明明初大案的特点：不是针对个别人，而是对整个官僚系统的清洗。

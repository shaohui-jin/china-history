id: zizhitongjian-qinji
title: 资治通鉴
volume: 卷七·秦纪二·始皇三十七年
author: 司马光等
composed: 公元 1084 年
type: classic
quote: 始皇恶言死，群臣莫敢言死事。病益甚，乃令中车府令行符玺事赵高为书赐扶苏曰：「以兵属蒙恬，与丧会咸阳而葬。」书已封，在赵高所，未付使者。秋，七月，丙寅，始皇崩于沙丘平台。丞相斯为上崩在外，恐诸子及天下有变，乃秘之，不发丧。……赵高与公子胡亥、丞相李斯阴谋破去始皇所封书，更诈为丞相斯受始皇遗诏沙丘，立子胡亥为太子。
note: 《通鉴》对沙丘之事的叙述，比《史记》更冷峻。「恐诸子及天下有变，乃秘之」——秘不发丧的理由说得很直白：怕诸子争位。「阴谋破去始皇所封书」——「破去」二字极重，是毁掉原诏，而不只是换一个说法。司马光把这件事编在秦纪的末尾，紧接陈胜起义，编排本身就有判断：秦亡始于沙丘。

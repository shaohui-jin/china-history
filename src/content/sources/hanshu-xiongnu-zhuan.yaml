id: hanshu-xiongnu-zhuan
title: 汉书
volume: 卷九十四下·匈奴传下
author: 班固
composed: 约公元 82 年
quote: 竟宁元年，单于复入朝，礼赐如初，加衣服锦帛絮，皆倍于黄龙时。单于自言愿婿汉氏以自亲。元帝以后宫良家子王墙字昭君赐单于。……王昭君号宁胡阏氏，生一男伊屠智牙师，为右日逐王。……及呼韩邪死，其前阏氏子代立，欲妻之，昭君上书求归，成帝敕令从胡俗，遂复为后单于阏氏焉。
note: 《匈奴传》的记载比《元帝纪》详细得多，且透露了几个关键事实：一是「单于自言愿婿汉氏以自亲」——是匈奴单于主动求亲，不是汉朝主动和亲；二是昭君生一子；三是呼韩邪死后，其前妻之子要娶她，昭君「上书求归」，成帝「敕令从胡俗」，她遂再嫁。这三个细节都与后世流传的「昭君自愿请行、悲怨出塞」形象不符——她曾请求回国，被驳回。

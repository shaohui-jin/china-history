id: mengzi-tengwengong
title: 孟子
volume: 滕文公上·井田
author: 孟子及其弟子
composed: 战国中期
type: classic
quote: 夫滕，壤地褊小，将为君子焉，将为野人焉。无君子莫治野人，无野人莫养君子。请野九一而助，国中什一使自赋。卿以下必有圭田，圭田五十亩，余夫二十五亩。死徙无出乡，乡田同井，出入相友，守望相助，疾病相扶持，则百姓亲睦。方里而井，井九百亩，其中为公田。八家皆私百亩，同养公田；公事毕，然后敢治私事，所以别野人也。
note: 井田制最完整的描述，出自孟子对滕文公的问对。要注意：孟子在这里是「请」——建议滕国实行，不是描述既成制度。全文的关键句是「方里而井，井九百亩，其中为公田。八家皆私百亩，同养公田」。但孟子说这番话时（战国中期）井田制早已瓦解，他所描述的究竟是商周旧制，还是儒家的理想化构想，学界至今争论。把它当作西周实况引用是有风险的。

id: zuozhuan-xigong-22
title: 左传
volume: 僖公二十二年·宋公及楚人战于泓
author: 相传左丘明撰
composed: 战国前期
quote: 宋公及楚人战于泓。宋人既成列，楚人未既济。司马曰：「彼众我寡，及其未既济也，请击之。」公曰：「不可。」既济而未成列，又以告。公曰：「未可。」既陈而后击之，宋师败绩。公伤股，门官歼焉。国人皆咎公。公曰：「君子不重伤，不禽二毛。古之为军也，不以阻隘也。寡人虽亡国之余，不鼓不成列。」
note: 「不鼓不成列」的出处。宋襄公在楚军渡河未毕、列阵未成时两次拒绝出击，理由是「君子不重伤，不禽二毛」、「不以阻隘」。结果是宋师大败，襄公伤股。子鱼事后评论：「君未知战。」《左传》把襄公的迂腐与子鱼的通达并置，不下断语，但倾向明显。

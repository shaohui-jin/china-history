id: shiji-yin-benji
title: 史记
volume: 卷三·殷本纪
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 帝盘庚之时，殷已都河北，盘庚渡河南，复居成汤之故居，乃五迁，无定处。殷民咨胥皆怨，不欲徙。盘庚乃告谕诸侯大臣曰：「昔高后成汤与尔之先祖俱定天下，法则可修。舍而弗勉，何以成德！」乃遂涉河南，治亳，行汤之政，然后百姓由宁，殷道复兴。诸侯来朝，以其遵成汤之德也。……帝武丁即位，思复兴殷，而未得其佐。三年不言，政事决定于冢宰，以观国风。武丁夜梦得圣人，名曰说。以梦所见视群臣百吏，皆非也。于是乃使百工营求之野，得说于傅险中。……举以为相，殷国大治。
note: 商代历史的基本文献。《殷本纪》记盘庚迁殷与武丁得傅说两事，是《尚书·盘庚》《说命》的史传化改写。王国维以甲骨卜辞与《殷本纪》对勘，作《殷卜辞中所见先公先王考》，证明商王世系大体可信——这是「二重证据法」的典范。但《殷本纪》成书距商亡已千年，细节仍须与卜辞互证。

id: qingshigao-yangwu
title: 清史稿
volume: 卷一百四十九·交通志·铁路
author: 赵尔巽等
composed: 约公元 1928 年
type: classic
quote: 同治初，李鸿章、曾国藩等，以西洋船炮之利，议设局仿造。同治四年，曾国藩、李鸿章设江南机器制造总局于上海。五年，左宗棠设福州船政局。九年，李鸿章设机器局于天津。十一年，设轮船招商局。光绪初，议修铁路，刘铭传、李鸿章先后奏请，为守旧者所阻。
note: 《清史稿》对洋务运动的客观记载。按年份排列：江南制造总局（1865）、福州船政局（1866）、天津机器局（1870）、轮船招商局（1872）。「光绪初，议修铁路……为守旧者所阻」——这一句点出洋务运动的内在阻力：不是不想做，而是做不下去。修铁路的提议在朝中被守旧派阻挠多年，直到 1880 年代才部分实现。

id: mingshi-jishi-benmo
title: 明史纪事本末
volume: 卷十三·胡蓝之狱
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 洪武二十六年二月，凉国公蓝玉谋反，伏诛。……玉，定远人，常遇春妇弟也。……玉长身赪面，饶勇略。……上欲诛之，未有以发。会锦衣卫指挥蒋瓛告玉谋反，遂下狱，狱具，磔于市，夷三族。……凡列侯以下，坐党论死者万五千人。……初，玉之诛也，上命揭榜示天下，名曰《逆臣录》。
note: 《明史纪事本末》专记蓝玉案。「上欲诛之，未有以发」——这七个字是谷应泰的判断：朱元璋早有杀心，只是缺一个由头。蒋瓛的告发正好提供了这个由头。「凡列侯以下，坐党论死者万五千人」是具体的数字，比《明史》的「不可胜数」更明确。谷应泰是清初人，成书早于《明史》，所据材料多来自明代私修史书与实录。

id: hongjun-changzheng-qinli
title: 红军长征记
volume: 上卷·出发前后
author: 红军长征亲历者集体撰写
composed: 公元 1937 年
type: modern
quote: 红军出发时，中央红军共八万六千余人。经过湘江之战，锐减至三万余人。湘江一战，是长征中最惨烈的一战。……过湘江后，全军的情绪起了很大的变化。大家都在问：这样走下去，走到哪里去？……遵义会议以后，部队的士气为之一振。
note: 长征亲历者的集体回忆，1937 年在延安编成。「中央红军共八万六千余人。经过湘江之战，锐减至三万余人」——湘江之战损失过半，这是长征中最惨烈的一战。「大家都在问：这样走下去，走到哪里去？」——这句话记录了当时的普遍情绪，也是遵义会议召开的直接背景。「遵义会议以后，部队的士气为之一振」——一个领导层的改组，改变了整支军队的状态。

id: mingshi-jishi-guoben
title: 明史纪事本末
volume: 卷六十七·争国本
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 神宗皇后无子，王恭妃生皇长子常洛，郑贵妃生皇三子常洵。……万历十四年，辅臣申时行等请立东宫，不报。……自是廷臣争言建储，章疏累千百上，帝皆不省。……二十九年十月，始立常洛为皇太子，封常洵为福王。……自十四年至二十九年，凡十五年，朝野汹汹，几至大乱。
note: 国本之争的全过程。「自十四年至二十九年，凡十五年，朝野汹汹，几至大乱」——十五年间，朝臣不断上疏请立太子，皇帝一概不理。「章疏累千百上，帝皆不省」——这七个字说明神宗的态度：不拒绝，也不答应，用拖延来对抗。「几至大乱」是谷应泰的判断：如果郑贵妃之子真的被立，明朝可能在万历年间就爆发内战。

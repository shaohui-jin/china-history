id: zuozhuan-dinggong-4
title: 左传
volume: 定公四年·祝佗论分封
author: 相传左丘明撰
composed: 战国前期
type: classic
quote: 昔武王克商，成王定之，选建明德，以蕃屏周。故周公相王室，以尹天下，于周为睦。分鲁公以大路、大旂，夏后氏之璜，封父之繁弱，殷民六族……分之土田陪敦，祝、宗、卜、史，备物、典策，官司、彝器；因商奄之民，命以伯禽而封于少皞之虚。分康叔以大路、少帛、綪茷、旃旌、大吕，殷民七族……封畛土略，自武父以南及圃田之北竟。分唐叔以大路、密须之鼓、阙巩、沽洗，怀姓九宗，职官五正。命以《唐诰》而封于夏虚，启以夏政，疆以戎索。
note: 分封制最具体的记载，出自祝佗（子鱼）对周初封建的追述。它把「分封」拆成几个可核对的要素：赐车旗彝器（礼器）、赐殷民若干族（人口）、赐土田（土地）、赐职官典策（制度）、命以诰命（名分）。这五项缺一不可，说明分封不是简单的「给一块地」，而是一整套权利义务的授予。「以蕃屏周」四字是分封的目的——用同姓与功臣作屏障，卫护周室。

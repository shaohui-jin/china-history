id: wangguowei-yinbuci
title: 殷卜辞中所见先公先王考
volume: 观堂集林卷九
author: 王国维
composed: 公元 1917 年
type: modern
quote: 自汉以来，中国学问上之最大发见有三：一为孔子壁中书，二为汲冢书，三则今之殷虚甲骨文字也。……卜辞之出于殷虚者，其文字谓之殷人自书，其时代谓之殷代。以卜辞证《殷本纪》，而后《殷本纪》之所记，乃得实矣。
note: 甲骨文研究的方法论奠基之作。王国维提出「二重证据法」——地下之新材料与纸上之旧材料互相印证。他据卜辞中的商王世系，逐条核对《史记·殷本纪》，发现除个别次序有误外，大体相合。这既证明了甲骨文确为商代遗物，也证明了《殷本纪》的可靠性。「中国学问上之最大发见有三」的判断，把甲骨文与孔壁中书、汲冢书并列，是二十世纪初学界公认的评价。

id: zhanguoce-qice-sunbin
title: 战国策
volume: 齐策一·田忌为齐将
author: 刘向辑
composed: 西汉末辑成，材料出战国
quote: 田忌为齐将，系梁太子申，禽庞涓。孙子谓田忌曰：「将军可以为大事乎？」田忌曰：「可得闻乎？」孙子曰：「将军无解兵而入齐。使彼罢弊先弱守于主，主者，循轶之途也，辖击摩车而相过。使彼罢弊先弱守于主，必一而当十，十而当百，百而当千。然后背太山，左济，右天唐，军重踵高宛，使轻车锐骑冲雍门。若是，则齐君可正，成侯可走。不然，则不得入齐矣。」田忌不听，果不入齐。
note: 《战国策》记马陵之战后孙子（孙膑）劝田忌拥兵自重、挟制齐君，田忌不听，终至出奔。这段与《史记》所记大不相同：《史记》说田忌因邹忌之谗而「率其徒袭临淄，不胜，出奔楚」，《战国策》则说孙膑早已献上「解兵不入齐」之策，田忌不用才失败。两书对结局一致（田忌不能立足），对原因则各有一套——这正是战国史料的特点：同一事件，说法可以差得很远。

id: jiutangshu-zhangjiuling
title: 旧唐书
volume: 卷九十九·张九龄传
author: 刘昫等
composed: 约公元 945 年
quote: 九龄为中书令，时安禄山以范阳偏校入奏，气骄蹇。九龄谓裴光庭曰：「乱幽州者，此胡雏也。」及讨奚、契丹败，张守珪执如京师，九龄署其状曰：「穰苴出师而诛庄贾，孙武习战犹戮宫嫔，守珪法行于军，禄山不容免死。」帝不许，赦之。九龄曰：「禄山狼子野心，面有逆相，臣请因罪戮之，冀绝后患。」帝曰：「卿勿以王夷甫识石勒，枉害忠良。」
note: 张九龄请诛安禄山一事，《旧唐书》本传记载最详，玄宗「卿勿以王夷甫识石勒，枉害忠良」的回答，是开元末政治判断失误的著名例证。

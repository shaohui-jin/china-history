id: chenduxiu-shian-zizhuan
title: 实庵自传
volume: 第一章·没有父亲的孩子
author: 陈独秀
composed: 公元 1937 年
type: modern
quote: 我从小便是一个没有父亲的孩子。……我背书背不出来时，母亲便要打我，祖父更是常常打我的。……我后来回想起来，才明白，我这所以不觉得什么痛苦，是因为我对旧式教育早已存了反感。……这种反感，可以说是后来反对旧礼教的种子。
note: 陈独秀晚年的自传，只写成两章。这段回忆提供了《敬告青年》的思想前史：对旧式教育的反感，是从被祖父与母亲责打的具体经验中生长出来的，而不是从书本上得来。这一细节很重要——「打倒旧礼教」的姿态，往往源于个人童年对礼教秩序的具体体验，而非抽象的理论推演。

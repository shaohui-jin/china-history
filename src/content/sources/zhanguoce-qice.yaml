id: zhanguoce-qice
title: 战国策
volume: 齐策一·邹忌修八尺有余
author: 刘向辑
composed: 西汉末辑成，材料出战国
quote: 邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：「我孰与城北徐公美？」……暮寝而思之，曰：「吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。」于是入朝见威王，曰：「臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。」王曰：「善。」乃下令：「群臣吏民能面刺寡人之过者，受上赏。」
note: 《战国策·齐策一》记邹忌以家事讽齐威王纳谏。「吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也」——三段排比把「评价为何不可信」讲得极清楚：亲、畏、求，三种关系各产生一种失真。这与威王后来派人实地考察即墨、阿两大夫的做法，是同一套认识论。

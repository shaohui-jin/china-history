id: zuozhuan-dinggong
title: 左传
volume: 定公十年·夹谷之会
author: 相传左丘明撰
composed: 战国前期
quote: 夏，公会齐侯于祝其，实夹谷。孔丘相。犁弥言于齐侯曰：「孔丘知礼而无勇，若使莱人以兵劫鲁侯，必得志焉。」齐侯从之。孔丘以公退，曰：「士，兵之！两君合好，而裔夷之俘以兵乱之，非齐君所以命诸侯也。裔不谋夏，夷不乱华，俘不干盟，兵不逼好。于神为不祥，于德为愆义，于人为失礼，君必不然。」齐侯闻之，遽辟之。
note: 《左传》对夹谷之会的记载比《史记》更简，但有一个《史记》所无的关键细节：犁弥判断「孔丘知礼而无勇」，所以建议用莱人武装劫持鲁侯。孔子的应对正是把「礼」当成武器——「裔不谋夏，夷不乱华，俘不干盟，兵不逼好」四句排比，每一句都指向齐侯违反了自己承认的秩序。这不是辩才，是把对方的失礼变成对方无法承受的指控。

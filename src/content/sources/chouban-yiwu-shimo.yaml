id: chouban-yiwu-shimo
title: 筹办夷务始末
volume: 咸丰朝卷七十一·英法联军入京
author: 贾桢等纂
composed: 约公元 1867 年
type: classic
quote: 咸丰十年八月，英法联军自通州进犯，僧格林沁败于八里桥。……二十二日，上自圆明园启銮，幸热河。……二十三日，夷人入圆明园，焚掠。……九月初五日，奕䜣与英法订约，增开天津为商埠，割九龙司与英，赔偿英法兵费各八百万两。
note: 第二次鸦片战争最权威的官方档案汇编。《筹办夷务始末》是清代官修的对外交涉史料汇编，按年月编排上谕与奏折。这段记咸丰十年（1860）的关键几天：八里桥兵败、咸丰逃往热河、圆明园被焚、签订《北京条约》。「上自圆明园启銮，幸热河」——皇帝从圆明园出逃，用「启銮」「幸」这样的字眼，把溃逃写成了巡幸。官方文书的避讳，在这里格外刺眼。

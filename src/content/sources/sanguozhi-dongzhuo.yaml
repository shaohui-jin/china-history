id: sanguozhi-dongzhuo
title: 三国志
volume: 卷六·魏书·董卓传
author: 陈寿
composed: 约公元 297 年
type: classic
quote: 卓既率精兵来，适帝北芒，公卿以下，莫能相禁。卓遂僭拟车服，与宾客宴饮，纵兵士突宫人，略公主，剽虏资物，妻略妇女。……卓性残忍，每朝廷有事，卓辄曰：「吾为天下计，岂恤人言！」侍御史扰龙宗诣卓白事，不解剑，立挝杀之。……卓以山东豪杰并起，乃徙天子都长安，焚烧洛阳宫室，悉发掘陵墓，取宝物。
note: 《三国志·董卓传》所记，比《后汉书》更侧重其暴行的具体场面。「纵兵士突宫人，略公主，剽虏资物」——连公主都被士卒凌辱，可见军纪已完全崩溃。「不解剑，立挝杀之」——一个侍御史来汇报工作，只因没有解下佩剑就被当场打死。这些细节说明董卓的统治不靠制度，只靠恐惧。「焚烧洛阳宫室，悉发掘陵墓」——迁都长安时把洛阳彻底毁掉，两汉四百年的宫室典籍尽毁于火。

id: mingshi-xuanzong
title: 明史
volume: 卷九·宣宗本纪·赞
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 宣宗即位，承仁宗之余烈，吏称其职，政得其平。……然其时国用充裕，民物康阜。……帝之英断，亦有过人者。……罢交阯之役，息兵养民，尤有汉文帝之风。
note: 《明史·宣宗本纪》赞。「吏称其职，政得其平」「国用充裕，民物康阜」——这是对仁宣之治内容的具体概括。「罢交阯之役，息兵养民，尤有汉文帝之风」——把放弃交阯与汉文帝的休养生息相比，是清代史官对宣德朝对外政策转向的正面评价。宣宗在位十年，是明朝少有的「守成之君」被充分肯定的例子。

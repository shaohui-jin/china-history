id: xintangshu-zetian
title: 新唐书
volume: 卷四·则天皇后本纪·赞
author: 欧阳修、宋祁
composed: 约公元 1060 年
type: classic
quote: 武后之恶，不及于大戮，所谓幸免者也。至中宗韦氏，则祸不旋踵矣。然赏罚己出，不假借群臣，僭于上而治于下，故能终天年，不底于乱。呜呼，其可鉴也已！
note: 《新唐书·则天本纪》赞，欧阳修的评价。「赏罚己出，不假借群臣，僭于上而治于下」——这十四个字是一个矛盾的判断：她僭越了名分（僭于上），但治理得不错（治于下）。欧阳修没有否认她的能力，只是把「僭」与「治」并列，让读者自己去权衡。「故能终天年，不底于乱」——她能善终，国家也没乱，这是结果。

id: guolian-diaochatuan-baogao
title: 国际联盟调查团报告书
volume: 第四章·九一八事变前之中国与日本
author: 李顿调查团
composed: 公元 1932 年 10 月
type: modern
quote: 一九三一年九月十八日夜，日本军队在沈阳附近之柳条湖，炸毁南满铁路之一段，随即指为中国军队所为，进攻沈阳。中国军队未作抵抗，日军于一夜之间占领沈阳。……调查团认为，此事件之发生，不能视为日本方面自卫之行为。
note: 国联李顿调查团的报告书，1932 年 10 月公布。这是九一八事变最重要的第三方文献——既不是中国也不是日本方面，而是国际组织的调查结论。报告确认三点：日军炸毁铁路并嫁祸中国军队、中国军队未作抵抗、日方行为不构成自卫。日本因此退出国联。需要注意的是，报告同时承认日本在满洲有「特殊利益」，并未主张立即恢复中国主权，而是提出国际共管方案——这也说明当时的国际秩序对小国的保护是有限的。

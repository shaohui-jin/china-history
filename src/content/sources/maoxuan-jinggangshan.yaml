id: maoxuan-jinggangshan
title: 毛泽东选集
volume: 第一卷·中国的红色政权为什么能够存在？（1928 年 10 月）
author: 毛泽东
composed: 公元 1928 年 10 月
type: modern
quote: 一国之内，在四围白色政权的包围中间，产生一小块或若干小块的红色政权区域，在目前的世界上只有中国有这种事。我们分析它发生的原因之一，在于中国有买办豪绅阶级间的不断的分裂和战争。只要买办豪绅阶级间的分裂和战争是继续的，则工农武装割据的存在和发展也将是能够继续的。……边界红旗子始终不倒，不但表示了共产党的力量，而且表示了统治阶级的破产。
note: 井冈山时期最重要的理论文献，写于 1928 年 10 月。「一国之内，在四围白色政权的包围中间，产生一小块或若干小块的红色政权区域，在目前的世界上只有中国有这种事」——这句话点出了「工农武装割据」的特殊性：它不是全国性的革命，而是利用统治阶级内部分裂而在夹缝中生存。「边界红旗子始终不倒，不但表示了共产党的力量，而且表示了统治阶级的破产」——这一判断后来成为「农村包围城市」理论的雏形。

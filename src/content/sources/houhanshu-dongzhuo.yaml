id: houhanshu-dongzhuo
title: 后汉书
volume: 卷七十二·董卓列传
author: 范晔
composed: 约公元 445 年
type: classic
quote: 卓未至，何进败。虎贲中郎将袁术乃烧南宫青琐门，欲以胁卓，而卓遂将兵诣京师。……卓到，遂废帝，立陈留王，是为献帝。……卓性残忍己甚，每朝廷有事，卓辄曰：「吾为天下计，岂恤人言！」……是时洛中贵戚室第相望，金帛财产，家家殷积。卓纵放兵士，突其庐舍，淫略妇女，剽虏资物，谓之「搜牢」。……卓又使吕布杀执金吾丁原而并其众。
note: 董卓之乱的记载。「废帝，立陈留王」——一个地方军阀入京数月就废立天子，东汉名存实亡自此始。「纵放兵士，突其庐舍，淫略妇女，剽虏资物，谓之搜牢」——「搜牢」是一个令人不寒而栗的词，把抢劫制度化、给暴行取一个官方的名字。此后关东诸侯起兵讨董，天下大乱。董卓之乱不只是一次暴政，它是东汉政权解体的实际起点。

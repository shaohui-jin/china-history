id: maguan-tiaoyue
title: 马关条约
volume: 光绪二十一年三月二十三日
author: 李鸿章、伊藤博文
composed: 公元 1895 年 4 月 17 日
type: classic
quote: 中国将管理下开地方之权并将该地方所有堡垒、军器工厂及一切属公物件，永远让与日本：一、奉天省南边地方，从鸭绿江口溯该江以抵安平河口，又从该河口划至凤凰城、海城及营口而止，画成折线以南地方。……二、台湾全岛及所有附属各岛屿。三、澎湖列岛。……中国约将库平银二万万两交与日本，作为赔偿军费。……中国约将现在日本军队所驻地方，暂行驻守，以为实行约内所订条款之担保。
note: 《马关条约》的原文条款。三处割让：辽东半岛、台湾、澎湖。赔款库平银二万万两——这是当时清政府年收入的三倍多。「中国约将现在日本军队所驻地方，暂行驻守，以为实行约内所订条款之担保」——日军暂驻作为赔款担保，这一条使日军在签约后仍占据威海卫等地。条约签订后，因俄德法三国干涉，日本归还辽东，但台湾的割让不可挽回。

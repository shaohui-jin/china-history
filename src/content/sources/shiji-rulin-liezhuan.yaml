id: shiji-rulin-liezhuan
title: 史记
volume: 卷一百二十一·儒林列传序
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 及至秦之季世，焚《诗》《书》，坑术士，六艺从此缺焉。……陈涉之王也，而鲁诸儒持孔氏之礼器往归陈王。于是孔甲为陈涉博士，卒与涉俱死。……故曰：悲夫！夫儒者之绌，而绌于秦；其兴，而兴于汉。
note: 《儒林列传》序是理解「焚书坑儒」在汉代儒生记忆中的位置的关键文本。注意它的用词：「焚《诗》《书》，坑术士」——司马迁写的是「术士」不是「儒」。「六艺从此缺焉」，强调的不是人的死亡，而是典籍的中断。「其兴，而兴于汉」一句，把秦的压制与汉的复兴对举，正是汉代儒学确立正统的叙事框架。

id: liwenzhong-gong-quanshu
title: 李文忠公全书
volume: 奏稿卷二十四·筹议海防折
author: 李鸿章
composed: 公元 1874 年
type: classic
quote: 臣愚以为，今之论海防者，约有两端：一则曰练兵，一则曰制器。……自同治元年以来，京师设总理各国事务衙门，江南设机器制造局，福建设船政局，天津设机器局，上海设轮船招商局。……然究以限于财力，未能大举。……臣查西洋各国，以火器为长技，而火器之精，全在铁钢。中国之铁，虽不乏而钢未精。臣拟购外洋机器，仿造新式枪炮。
note: 洋务运动的自我陈述，出自李鸿章著名的《筹议海防折》。这份奏折把洋务的具体内容说得很清楚：总理衙门、机器制造局、船政局、招商局。「中国之铁，虽不乏而钢未精」——这句话概括了洋务运动的技术困境：能买到机器，但买不来冶金的基础。「究以限于财力，未能大举」——钱不够。这也是洋务运动的根本限制：它是一个地方性的、有限的现代化尝试，而非国家战略。

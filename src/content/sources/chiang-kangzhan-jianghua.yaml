id: chiang-kangzhan-jianghua
title: 蒋介石对芦沟桥事件之严正表示
volume: 1937 年 7 月 17 日庐山谈话
author: 蒋介石
composed: 公元 1937 年 7 月 17 日
type: modern
quote: 我们既是一个弱国，如果临到最后关头，便只有拼全民族的生命，以求国家生存；那时节再不容许我们中途妥协。须知中途妥协的条件，便是整个投降、整个灭亡的条件。全国国民最要认清，所谓最后关头的意义，最后关头一至，我们只有牺牲到底，抗战到底，唯有「牺牲到底」的决心，才能博得最后的胜利。若是彷徨不定，妄想苟安，便会陷民族于万劫不复之地。
note: 庐山谈话是西安事变后蒋介石对日政策的公开转变。「最后关头」一词是全文的关键——此前他主张「攘外必先安内」，此后则以「牺牲到底」为基调。西安事变（1936 年 12 月）到庐山谈话（1937 年 7 月）之间只有七个月，政策的转向之快，说明兵谏确实起了作用。这段讲话也与西安事变通电的八项主张形成呼应：「停止内战」的要求在半年后以抗战的形式实现。

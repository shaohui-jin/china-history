id: shiji-baiqi-guodu
title: 史记
volume: 卷七十三·白起王翦列传·邯郸之围
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 四十九年正月，陵攻邯郸，少利，秦益发兵佐陵。陵兵亡五校。武安君病愈，秦王欲使武安君代陵将。武安君言曰：「邯郸实未易攻也。且诸侯救日至，彼诸侯怨秦之日久矣。今秦虽破长平军，而秦卒死者过半，国内空。远绝河山而争人国都，赵应其内，诸侯攻其外，破秦军必矣。不可。」秦王自命，不行；乃使应侯请之，其固辞不肯行。……于是免武安君为士伍，迁之阴密。
note: 邯郸之围中白起的进谏。「今秦虽破长平军，而秦卒死者过半，国内空」——长平之战虽大胜，秦军自身也伤亡过半，国内空虚。白起据此判断邯郸不可攻：「远绝河山而争人国都，赵应其内，诸侯攻其外，破秦军必矣。」事后完全应验：秦军围邯郸三年不下，信陵君窃符救赵、春申君率师至，秦军大败。白起因坚持此见而被赐死于杜邮。这一段的讽刺意味极强——秦国最懂战争的人，因说对了而获罪。

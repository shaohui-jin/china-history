id: nianerzha-2
title: 廿二史札记
volume: 卷二·汉初布衣将相之局
author: 赵翼
composed: 约公元 1795 年
quote: 汉初诸臣，惟张良出身最贵，韩相之子也。其次则张苍，秦御史；叔孙通，秦待诏博士。次则萧何，沛主吏掾；曹参，狱掾；任敖，狱吏；周苛，泗水卒史；傅宽，魏骑将；申屠嘉，材官。其余陈平、王陵、陆贾、郦商、郦食其、夏侯婴等，皆白徒。樊哙则屠狗者，周勃则织薄曲吹箫给丧事者，灌婴则贩缯者，娄敬则挽车者。一时人才皆出其中，致身将相，前此所未有也。盖秦汉间为天地一大变局。
note: 「汉初布衣将相之局」是赵翼最著名的论断之一，指出秦汉之际社会流动性的结构性变化。此条常被用来说明刘邦集团的构成特征。

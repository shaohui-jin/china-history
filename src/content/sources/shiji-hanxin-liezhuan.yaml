id: shiji-hanxin-liezhuan
title: 史记
volume: 卷九十二·淮阴侯列传·太史公曰
author: 司马迁
composed: 约公元前 91 年
quote: 太史公曰：吾如淮阴，淮阴人为余言，韩信虽为布衣时，其志与众异。其母死，贫无以葬，然乃行营高敞地，令其旁可置万家。余视其母冢，良然。假令韩信学道谦让，不伐己功，不矜其能，则庶几哉，于汉家勋可以比周、召、太公之徒，后世血食矣。不务出此，而天下已集，乃谋畔逆，夷灭宗族，不亦宜乎！
note: 司马迁对韩信的评价是「功可比周召，然不务谦让」——既惜其才，又认为其结局有其自身原因。这与后世「兔死狗烹」的单一叙事不同。

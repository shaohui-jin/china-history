name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 允许手动触发，便于调试
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不取消进行中的，避免发布到一半被打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 必须放在 Build 之前：后面要用它输出的 origin / base_path 拼 SITE_URL / BASE_PATH。
      # 这样自定义域名、用户站（base 为空）、项目站（base 为 /repo）三种情况都自动正确，
      # 不需要在 workflow 里手写 format 拼字符串。
      #
      # 注意：这一步要求仓库已启用 Pages 且 build_type=workflow。
      # 若报 "Get Pages site failed ... Not Found"，说明 Pages 未启用，需先执行一次：
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      # （enablement: true 参数需要 PAT，GITHUB_TOKEN 无权限自动启用）
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # 类型检查：任何 TS 错误都让 CI 失败，不让它混进构建产物
      - name: Type check
        run: npm run check

      # 内容校验：引用断了就让 CI 失败，不让错数据上线
      # 同时扫描组件里硬编码的站内绝对路径（子路径部署会 404）
      - name: Validate content
        run: npm run validate

      # 样式令牌约束：颜色必须走 var(--color-*)，不写裸色值
      - name: Lint styles
        run: npm run lint:css

      # 纯函数单测：时间格式、区间求交、关系去重键
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # base_path 在用户站下是空字符串，兜底成 '/'
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

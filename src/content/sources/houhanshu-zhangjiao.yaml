id: houhanshu-zhangjiao
title: 后汉书
volume: 卷七十一·皇甫嵩传
author: 范晔
composed: 约公元 445 年
quote: 初，钜鹿张角自称「大贤良师」，奉事黄老道，畜养弟子，跪拜首过，符水咒说以疗病，病者颇愈，百姓信向之。角因遣弟子八人使于四方，以善道教化天下，转相诳惑。十余年间，众徒数十万，连结郡国，自青、徐、幽、冀、荆、扬、兖、豫八州之人，莫不毕应。遂置三十六方。方犹将军号也。大方万余人，小方六七千，各立渠帅。讹言「苍天已死，黄天当立，岁在甲子，天下大吉」。
note: 张角无专传，《后汉书》的记载附于《皇甫嵩传》，是黄巾起义最原始的史料。「苍天已死，黄天当立」的口号与三十六方的组织形态，皆出此篇。

id: guoque-yongle-qiandu
title: 国榷
volume: 卷十七·永乐十八年
author: 谈迁
composed: 约公元 1653 年
type: classic
quote: 永乐十八年十一月，以迁都北京诏天下。……初，上之北巡也，命工部营建北京宫殿。至是，规制悉如南京，而高敞壮丽过之。……十九年正月甲子朔，御奉天殿受朝贺，大宴文武群臣及四夷朝使。……自是一意北巡，不复南还。
note: 谈迁《国榷》记迁都北京。谈迁是明末清初的民间史家，《国榷》以私人身份修撰明史，不避忌讳，材料多取自明代邸报与实录。「规制悉如南京，而高敞壮丽过之」——北京宫殿以南京为蓝本而更宏大。「自是一意北巡，不复南还」——从此不再回南京。迁都的决定性因素是政治：永乐帝的根基在北平，南京是建文帝的旧都。

id: shishuoxinyu-yuzao
title: 世说新语
volume: 言语·新亭对泣
author: 刘义庆
composed: 约公元 440 年
type: classic
quote: 过江诸人，每至美日，辄相邀新亭，藉卉饮宴。周侯中坐而叹曰：「风景不殊，正自有山河之异！」皆相视流泪。唯王丞相愀然变色曰：「当共戮力王室，克复神州，何至作楚囚相对？」
note: 「新亭对泣」的出处，也是理解「衣冠南渡」心理状态最直接的文本。过江的士人在新亭宴饮，周顗感叹「风景不殊，正自有山河之异」——风景没变，但山河已经不是我们的了。满座流泪，只有王导变色说狠话。这一段的可贵在于它记录的是一种集体情绪：南渡士族的乡愁与自惭。它比任何史书的「衣冠南渡」四字都更具体。

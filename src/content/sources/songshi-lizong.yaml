id: songshi-lizong
title: 宋史
volume: 卷四十一至四十五·理宗本纪
author: 脱脱等
composed: 约公元 1345 年
quote: 端平元年，赵范、赵葵请乘灭金之势，收复三京。诏从之。全子才率师入汴，蒙古兵来争，我师败绩，死者十余万。……史臣曰：理宗享国四十余年，宋之世，未有其比。然任用非人，政不一出于己，金亡而图复三京，轻启边衅，遂至兵连祸结。
note: 《宋史·理宗本纪》记端平入洛的惨败，末附史臣论赞。「理宗享国四十余年，宋之世，未有其比」是承认其在位之长；紧接着的「任用非人，政不一出于己」「轻启边衅，遂至兵连祸结」则是定评。元人修《宋史》时把南宋的覆亡溯因于端平入洛，这一判断影响了后世对理宗的评价。

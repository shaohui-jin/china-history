id: zuozhuan-aigong
title: 左传
volume: 哀公元年至二十七年·吴越之争
author: 相传左丘明撰
composed: 战国前期
quote: 吴王夫差还自黄池，息民不戒。越大夫种乃倡谋曰：「吾谓吴王将遂涉吾地，今罢师而不戒以忘我，我不可以怠。日臣尝卜于天，今吴民既罢，而大荒荐饥，市无赤米，而囷鹿空虚，其民必移就蒲蠃于东海之滨。天占既兆，人事又见，我蔑卜筮矣。」……越灭吴。
note: 《左传》记事至哀公二十七年，吴越之争是其最后的大事件之一。这段记载的价值在于它写的是「乘虚」的判断依据：吴民疲敝、大荒饥馑、市无赤米、仓廪空虚。文种不是凭卜筮，而是凭「天占既兆，人事又见」——天象与人事同时指向同一个结论。越灭吴，靠的是对吴国国力耗尽的精准判断。

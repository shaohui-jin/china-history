id: shijing-daya-mian
title: 诗经
volume: 大雅·绵
author: 无名氏
composed: 西周前期
quote: 绵绵瓜瓞。民之初生，自土沮漆。古公亶父，陶复陶穴，未有家室。……古公亶父，来朝走马。率西水浒，至于岐下。爰及姜女，聿来胥宇。……周原膴膴，堇荼如饴。爰始爰谋，爰契我龟。曰止曰时，筑室于兹。
note: 「古公亶父，来朝走马。率西水浒，至于岐下」——这是太王（古公亶父）迁岐最早的文献依据，出自《诗经·大雅·绵》。全诗记周人从豳迁到岐下周原、营建宫室的过程。「周原膴膴，堇荼如饴」写的是土地的肥沃——苦菜都长得像糖一样甜。这一句透露了迁岐的真实动机：不是躲避，是择地。

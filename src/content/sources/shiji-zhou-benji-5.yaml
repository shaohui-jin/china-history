id: shiji-zhou-benji-5
title: 史记
volume: 卷四·周本纪·太王至文王
author: 司马迁
composed: 约公元前 91 年
quote: 古公亶父复修后稷、公刘之业，积德行义，国人皆戴之。薰育戎狄攻之，欲得财物，予之。已复攻，欲得地与民。民皆怒，欲战。古公曰：「有民立君，将以利之。今戎狄所为攻战，以吾地与民。民之在我，与其在彼，何异？民欲以我故战，杀人父子而君之，予不忍为。」乃与私属遂去豳，度漆、沮，逾梁山，止于岐下。豳人举国扶老携弱，尽复归古公于岐下。及他旁国闻古公仁，亦多归之。
note: 太王迁岐的叙事比《诗经》详细得多，关键在动机：「民之在我，与其在彼，何异？民欲以我故战，杀人父子而君之，予不忍为。」——古公不愿为保住自己的君位而让百姓死战，于是主动离开豳地。这一叙述把迁岐解释成道德选择而非军事退却。需注意这是《史记》的加工：司马迁距此事已千年，《诗经》只记迁的事实，不记这个理由。

id: sunwen-sanminzhuyi-1924
title: 三民主义
volume: 民生主义第一讲·关于马克思主义
author: 孙中山
composed: 公元 1924 年 8 月
type: modern
quote: 我们讲到民生主义，虽然是很崇拜马克思的学问，但是不能用马克思的办法到中国来实行。这个理由很容易明白，就是俄国实行马克思的办法，革命以前和革命以后的制度，都是和现在欧美各国不同。……中国今是患贫，不是患不均。在不均的社会，当然可用马克思的办法，提倡阶级战争去打平他；但在中国实业尚未发达的时候，马克思的阶级战争、无产专制便用不着。所以我们今日师马克思之意则可，用马克思之法则不可。
note: 1924 年孙中山讲民生主义时对马克思主义的明确表态，是理解第一次国共合作的关键文本。他的判断是「中国今是患贫，不是患不均」——中国的问题是生产力不足，不是分配不均，所以阶级斗争与无产阶级专政用不上。这一判断与中共一大的纲领直接冲突：同一时期，一边主张无产阶级专政，一边主张先发展实业。两者的联盟建立在反帝反军阀的共同目标上，而非理论一致。这解释了为什么 1927 年的分裂几乎不可避免。

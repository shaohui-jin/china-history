id: mingshi-jishi-donglin
title: 明史纪事本末
volume: 卷六十六·东林党议
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 万历间，顾宪成讲学东林书院，一时名士，多从之游。……其后党祸既起，凡攻东林者，皆指为邪党，而东林诸贤，亦多不得其死。……论者谓：明之亡，亡于党争。党争之祸，始于东林。……然东林诸君子，多以气节相尚，慷慨赴义，视死如归，亦一时之盛也。
note: 谷应泰对东林党议的总结。「论者谓：明之亡，亡于党争。党争之祸，始于东林」——这是明末清初的通行判断：明亡的直接原因之一是党争，而党争的源头是东林。但谷应泰没有把责任全推给东林，接着说「东林诸君子，多以气节相尚，慷慨赴义，视死如归，亦一时之盛也」——承认其气节。这一双重评价，比单纯的「东林误国」或「东林忠烈」更接近实况。

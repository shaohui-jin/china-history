id: mingshi-renzong
title: 明史
volume: 卷八·仁宗本纪·赞
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 仁宗之为人也，至性纯笃，言必称尧、舜。……在位仅十月，而用人行政，有可称者。……使天假之年，涵濡休养，德化之盛，岂不与文、景比隆哉！
note: 《明史·仁宗本纪》赞。仁宗在位仅十个月，是明朝在位最短的皇帝之一，但《明史》给了他极高的评价：「使天假之年，涵濡休养，德化之盛，岂不与文、景比隆哉！」——如果给他足够的年岁，其治绩可与文景之治相比。这一假设性的评价，表达的是史官的惋惜：仁宗的施政方向是对的，只是时间不够。他的儿子宣宗延续了这一方向，两人合称「仁宣之治」。

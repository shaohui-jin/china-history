id: mingshi-lanyu
title: 明史
volume: 卷一百三十二·蓝玉传
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 二十六年二月，锦衣卫指挥蒋瓛告玉谋反，下吏鞫讯。狱具，族诛之。列侯以下坐党夷灭者不可胜数。……玉长身赪面，饶勇略，有大将才。……数总大军，多立功。太祖遇之厚。然骄蹇自恣，多蓄庄奴假子，乘势暴横。尝占东昌民田，御史按问，玉怒，逐御史。北征还，夜扣喜峰关，关吏不时纳，玉怒，纵兵毁关入。帝闻之不乐。
note: 蓝玉案的官方记载。「玉长身赪面，饶勇略，有大将才」——朱元璋的亲外甥之子、洪武后期最倚重的将领，捕鱼儿海大破北元。「然骄蹇自恣」以下列其罪状：强占民田、驱逐御史、纵兵毁关。这些事都是真的，但不足以构成「谋反」。此案「列侯以下坐党夷灭者不可胜数」，死者一万五千人以上，是明初四大案中株连最广的一次。

id: shiji-wuqi
title: 史记
volume: 卷六十五·孙子吴起列传·吴起
author: 司马迁
composed: 约公元前 91 年
quote: 吴起者，卫人也，好用兵。尝学于曾子，事鲁君。……起之为将，与士卒最下者同衣食。卧不设席，行不骑乘，亲裹赢粮，与士卒分劳苦。卒有病疽者，起为吮之。卒母闻而哭之。人曰：「子卒也，而将军自吮其疽，何哭为？」母曰：「非然也。往年吴公吮其父，其父战不旋踵，遂死于敌。吴公今又吮其子，妾不知其死所矣。是以哭之。」……楚悼王素闻起贤，至则相楚。明法审令，捐不急之官，废公族疏远者，以抚养战斗之士。……及悼王死，宗室大臣作乱而攻吴起，吴起走之王尸而伏之。击起之徒因射刺吴起，并中悼王。悼王既葬，太子立，乃使令尹尽诛射吴起而并中王尸者。坐射起而夷宗死者七十余家。
note: 吴起传记的主体。「吮疽」一段是先秦史料中对「爱兵」最细致的记述，而那位母亲的哭诉给出了另一面：将军的恩惠是要用儿子的命来还的。末尾记其死法——伏于王尸，使射者同时中王尸，按楚律夷宗七十余家。司马迁写得极冷静，不加评断，但「吴起之智，可谓捷矣」式的判断已经隐含其中。

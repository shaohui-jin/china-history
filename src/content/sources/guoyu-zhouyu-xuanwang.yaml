id: guoyu-zhouyu-xuanwang
title: 国语
volume: 周语上·虢文公谏不籍千亩、仲山父谏料民
author: 相传左丘明撰
composed: 战国前期
quote: 宣王不籍千亩。虢文公谏曰：「不可。夫民之大事在农，上帝之粢盛于是乎出，民之蕃庶于是乎生，事之供给于是乎在，和协辑睦于是乎兴，财用蕃殖于是乎始，敦庞纯固于是乎成。」……宣王既丧南国之师，乃料民于太原。仲山父谏曰：「民不可料也！夫古者不料民而知其少多。」
note: 《国语·周语上》记宣王两事：不籍千亩、料民于太原。两事在书中都被处理成礼制问题而非行政问题——虢文公谈的是「民之大事在农」，仲山父谈的是「古者不料民而知其少多」。这反映了西周政治的基本逻辑：制度的合法性建立在仪式之上，仪式的废弃即是秩序的松动。

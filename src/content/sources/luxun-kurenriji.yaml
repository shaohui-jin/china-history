id: luxun-kurenriji
title: 狂人日记
volume: 《新青年》第四卷第五号
author: 鲁迅
composed: 公元 1918 年 5 月
type: modern
quote: 我翻开历史一查，这历史没有年代，歪歪斜斜的每叶上都写着「仁义道德」几个字。我横竖睡不着，仔细看了半夜，才从字缝里看出字来，满本都写着两个字是「吃人」！
note: 中国第一篇现代白话短篇小说。「吃人」这个判词，把传统礼教的全部内容压缩成一个动作。这一段的关键在「从字缝里看出字来」——文言文的「仁义道德」与实际的「吃人」之间的落差，正是鲁迅要揭示的东西。用白话小说而不是论文来写，这个选择本身也是宣言：只有白话才能说出文言说不出的东西。

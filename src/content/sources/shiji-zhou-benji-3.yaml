id: shiji-zhou-benji-3
title: 史记
volume: 卷四·周本纪·幽王至平王
author: 司马迁
composed: 约公元前 91 年
quote: 三年，幽王嬖爱褒姒。褒姒生子伯服，幽王欲废太子。太子母申侯女，而为后。后幽王得褒姒，爱之，欲废申后，并去太子宜臼，以褒姒为后，以伯服为太子。……申侯怒，与缯、西夷犬戎攻幽王。幽王举烽火征兵，兵莫至。遂杀幽王骊山下，虏褒姒，尽取周赂而去。……平王立，东迁于雒邑，辟戎寇。
note: 《周本纪》记西周之亡最完整的一段。需要注意的是：司马迁写「举烽火征兵」时，烽燧制度尚未产生（烽火作为边防通讯的可靠记载要到汉代），这一细节属后世附会，不能当作史实引用。废立、犬戎入寇、平王东迁三事本身则与他书相合。

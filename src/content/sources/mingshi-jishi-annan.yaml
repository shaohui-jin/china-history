id: mingshi-jishi-annan
title: 明史纪事本末
volume: 卷二十二·安南叛服
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 宣德二年，黎利遣使奉表谢罪，请立陈氏后。上曰：「交阯之民，皆朕赤子，困于锋镝，朕甚悯之。今黎利既请立陈氏后，宜从所请。」遂诏罢交阯布政使司。……初，永乐中，张辅三定安南，设三司，置府州县。至是，凡二十一年而弃之。……论者以为：交阯之弃，非失地也，失在不能守。
note: 《明史纪事本末·安南叛服》记弃交阯的决策与事后评论。宣德帝的话「交阯之民，皆朕赤子，困于锋镝，朕甚悯之」——这是撤退的正当性说明：不是战败，是悯民。「论者以为：交阯之弃，非失地也，失在不能守」——谷应泰的评论比《明史》更尖锐：问题不在放弃，在于二十年都没能建立起统治的基础。这一判断把责任从「宣德」推到了「永乐」。

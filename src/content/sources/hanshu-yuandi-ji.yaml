id: hanshu-yuandi-ji
title: 汉书
volume: 卷九·元帝纪·竟宁元年
author: 班固
composed: 约公元 82 年
quote: 竟宁元年春正月，匈奴呼韩邪单于来朝。诏曰：「匈奴郅支单于背叛礼义，既伏其辜，呼韩邪单于不忘恩德，乡慕礼义，复修朝贺之礼，愿保塞传之无穷，边垂长无兵革之事。其改元为竟宁，赐单于待诏掖庭王樯为阏氏。」
note: 昭君出塞的原始记载只有这一句：「赐单于待诏掖庭王樯为阏氏。」——王樯（即王昭君），「待诏掖庭」是宫女的身份，「阏氏」是匈奴王后。班固的记载极简，没有对话，没有自愿请行，没有琵琶。此后所有细节（画工毛延寿、自愿和亲、马上琵琶）都是后世添加的。这一对比很能说明问题：一个被叙述了两千年的故事，其史源只有二十几个字。

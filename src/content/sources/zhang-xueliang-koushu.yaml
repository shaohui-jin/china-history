id: zhang-xueliang-koushu
title: 张学良口述历史
volume: 关于九一八与不抵抗
author: 张学良口述，唐德刚整理
composed: 公元 1990 年
type: modern
quote: 那个不抵抗的命令是我下的。我下的所谓不抵抗，就是你不要跟他们冲突，他来挑衅，你离开他，躲开他。……我当时判断，日本那样挑衅，是想挑起事端，我们一打，他就有了借口。所以我主张不抵抗，避免事态扩大。……后来事情闹大了，我没想到日本会那样干。所以这个事情，我要负责。
note: 张学良晚年口述，明确承认「不抵抗的命令是我下的」。这一说法与长期流传的「蒋介石下令不抵抗」不同，是研究九一八的关键一手材料。他的理由也值得注意：「日本那样挑衅，是想挑起事端，我们一打，他就有了借口」——这是「避免事端扩大」的判断，不是投降。但他的承认同样明确：「后来事情闹大了，我没想到日本会那样干。所以这个事情，我要负责。」口述史的价值与局限都在这里：当事人愿意负责，但回忆距事发已近六十年。

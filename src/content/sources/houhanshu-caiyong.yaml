id: houhanshu-caiyong
title: 后汉书
volume: 卷六十下·蔡邕列传
author: 范晔
composed: 约公元 445 年
quote: 邕以经籍去圣久远，文字多谬，俗儒穿凿，疑误后学，熹平四年，乃与五官中郎将堂溪典、光禄大夫杨赐、谏议大夫马日磾、议郎张驯、韩说、太史令单飏等，奏求正定《六经》文字。灵帝许之，邕乃自书丹于碑，使工镌刻立于太学门外。于是后儒晚学，咸取正焉。及碑始立，其观视及摹写者，车乘日千余两，填塞街陌。
note: 熹平石经的完整记载。「邕乃自书丹于碑」——蔡邕亲自用朱笔在碑上写字，由工匠镌刻。这是中国历史上第一次由朝廷统一刊定儒家经典的标准文本。「车乘日千余两，填塞街陌」——刻成之后，来抄写的人把街道都堵满了。这一细节比任何评价都更能说明石经的实际影响：它解决的是抄本混乱的问题，而抄本混乱是当时读书人最实际的困扰。

id: zizhitongjian-tangmo-huichang
title: 资治通鉴
volume: 卷二百四十八·唐纪六十四·武宗会昌五年
author: 司马光等
composed: 公元 1084 年
quote: 上恶僧尼耗蠹天下，欲去之，道士赵归真等复劝之。……乃先毁山野招提、兰若，敕上都、东都两街各留二寺，每寺留僧三十人；天下节度、观察使治所及同、华、商、汝州各留一寺，分为三等……余僧尼及大秦穆护、祆僧皆勒归俗。……五台僧多亡奔幽州。李德裕召进奏官谓曰：「汝趣白本使，五台僧为将必不如幽州将，为卒必不如幽州卒，何为虚取容纳之名，染于人口！独不见近日刘从谏招聚无算闲人，竟有何益！」张仲武乃封二刀付居庸关曰：「有游僧入境则斩之。」
note: 《通鉴》补出了《旧唐书》没有的两层信息。一是动机：「上恶僧尼耗蠹天下」——不是宗教偏见，是财政考虑；道士赵归真等人从旁推动，说明其中也有道教与佛教的竞争。二是执行的细节：僧人多逃亡，李德裕要求幽州节度使张仲武拒绝接纳，张仲武「封二刀付居庸关曰：有游僧入境则斩之」——一道关隘上的两把刀，比任何诏令都更能说明这场运动的严厉程度。

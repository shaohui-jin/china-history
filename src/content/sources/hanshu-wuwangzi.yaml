id: hanshu-wuwangzi
title: 汉书
volume: 卷六十三·武五子传·戾太子据
author: 班固
composed: 约公元 82 年
type: classic
quote: 武帝末，卫后宠衰，江充用事。充与太子及卫氏有隙，恐上晏驾后为太子所诛，会巫蛊事起，充因此为奸。……征和二年七月，壬午，太子使客诈为使者，收捕充等。……太子亦遣使者矫制赦长安中都官囚徒，发武库兵，命少傅石德及宾客张光等分将。……与丞相刘屈氂等战。……死者数万人，血流入沟中。……太子亡，东至湖，藏匿泉鸠里。……吏围捕太子，太子自度不得脱，即入室距户自经。
note: 巫蛊之祸最详细的记载。三个层次值得注意：一是起因——江充与太子有隙，「恐上晏驾后为太子所诛」，于是借巫蛊构陷；二是规模——「死者数万人，血流入沟中」，长安城内爆发了父子两军对战；三是结局——太子逃亡后自缢。这是汉武帝晚年最惨烈的一幕，也是他后来下「轮台罪己诏」的直接背景。一场由方士与猜忌推动的宫廷阴谋，最终演变成数万人死亡的动乱。

id: shiji-lu-zhougong-shijia
title: 史记
volume: 卷三十三·鲁周公世家·桓公
author: 司马迁
composed: 约公元前 91 年
quote: 桓公十八年，桓公与夫人如齐。齐襄公通桓公夫人。公怒夫人，夫人以告齐侯。夏四月丙子，齐襄公飨公，公醉，使公子彭生抱鲁桓公，因命彭生折其胁，公死于车。鲁人告于齐曰：「寡君畏君之威，不敢宁居，来修好礼。礼成而不反，无所归咎，请得彭生以除丑于诸侯。」齐人杀彭生以说鲁。
note: 《鲁周公世家》对同一事件的叙述比《左传》多出两个细节：彭生是「折其胁」致死，以及鲁国请求杀彭生的外交辞令「请得彭生以除丑于诸侯」——把责任推给彭生，为两国都留了体面。这段辞令是春秋外交的典型样本：明明知道是齐襄公授意，却只追究执行者。

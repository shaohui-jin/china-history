id: luxun-nahan-zixu
title: 《呐喊》自序
volume: 呐喊
author: 鲁迅
composed: 公元 1922 年
type: modern
quote: 我从一倍高的柜台外送上衣服或首饰去，在侮蔑里接了钱，再到一样高的柜台上给我久病的父亲去买药。……我有四年多，曾经常常，——几乎是每天，出入于质铺和药店里，年纪可是忘却了，总之是药店的柜台正和我一样高，质铺的是比我高一倍，我从一倍高的柜台外送上衣服或首饰去，在侮蔑里接了钱，再到一样高的柜台上给我久病的父亲去买药。
note: 鲁迅自述早年经历的文字，写父亲病重时他出入质铺与药店的两处柜台。两个柜台的高度差——「药店的柜台正和我一样高，质铺的是比我高一倍」——是鲁迅笔下最具体的一次不平等的显影。他在此文中还说「凡愚弱的国民，即使体格如何健全……也只能做毫无意义的示众的材料和看客」，弃医从文的理由即出于此。

id: gaosengzhuan-daoan
title: 高僧传
volume: 卷五·义解二·释道安
author: 慧皎
composed: 约公元 519 年
quote: 安以经出已久，而旧译时谬，致使深义隐没未通，每至讲说，唯叙大意，转读而已。安穷览经典，钩深致远，其所注《般若》《道行》《密迹》《安般》诸经，并寻文比句，为起尽之义，乃析疑甄解，凡二十二卷。……初，魏、晋沙门依师为姓，故姓各不同。安以为大师之本，莫尊释迦，乃以「释」命氏。
note: 《高僧传》是道安事迹最完整的记载，「以释命氏」一节说明他确立了汉地僧侣统一以「释」为姓的传统。其「不依国主，则法事难立」之语，亦见于本传。

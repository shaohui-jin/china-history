id: hushi-wenzixi
title: 文学改良刍议
volume: 《新青年》第二卷第五号
author: 胡适
composed: 公元 1917 年 1 月
type: modern
quote: 吾以为今日而言文学改良，须从八事入手。八事者何？一曰，须言之有物。二曰，不摹仿古人。三曰，须讲求文法。四曰，不作无病之呻吟。五曰，务去烂调套语。六曰，不用典。七曰，不讲对仗。八曰，不避俗字俗语。
note: 胡适提出「八不主义」，是文学革命的开端。八条中最要紧的是二、六、七、八：不摹仿古人、不用典、不讲对仗、不避俗字俗语——这四条合起来，等于取消了文言文作为一种书面语的全部技术要求，为白话文取代文言文扫清了理论障碍。文章发表于 1917 年 1 月，当时胡适 26 岁，尚在美国哥伦比亚大学。

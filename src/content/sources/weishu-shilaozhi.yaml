id: weishu-shilaozhi
title: 魏书
volume: 卷一百一十四·释老志
author: 魏收
composed: 约公元 554 年
type: classic
quote: 世祖即位，富于春秋。既而锐志武功，每以平定祸乱为先。虽归宗佛法，敬重沙门，而未存览经教，深求缘报之意。及得寇谦之道，帝以清净无为，有仙化之证，遂信行其术。……会盖吴反杏城，关中骚动，帝乃西伐，至于长安。先是，长安沙门种麦寺内，御驺牧马于麦中，帝入观马。沙门饮从官酒，从官入其便室，见大有弓矢矛盾，出以奏闻。帝怒曰：「此非沙门所用，当与盖吴通谋，规害人耳！」命有司案诛一寺，阅其财产，大得酿酒具及州郡牧守富人所寄藏物，盖以万计。又为窟室，与贵室女私行淫乱。帝既忿沙门非法，时崔浩亦言其诈伪，因劝帝灭之。
note: 北魏太武帝灭佛的直接起因，记载极为具体：长安一座寺院里发现弓矢矛盾，又被查出酿酒具、大量寄藏财物与藏匿妇女的密室。太武帝因此大怒，崔浩从旁推动，遂下灭佛之诏。这一记载说明灭佛的起因不是教义之争，而是寺院违法与政治猜忌（怀疑与盖吴通谋）。但更深的背景是：寺院占有大量人口土地，不纳税不服役，与国家的财政利益直接冲突。

id: shiji-jin-shijia-4
title: 史记
volume: 卷三十九·晋世家·平公
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 十四年，晋使六卿率诸侯伐秦，度泾，大败秦军。……平公十四年，吴延陵季子使晋，曰：「晋国之政，卒归此三家矣。」十九年，齐使晏婴如晋，与叔向语。叔向曰：「晋，季世也。公厚赋为台池而不恤政，政在私门，其可久乎！」
note: 《晋世家》从晋国内部记弭兵前后的形势。两条引文都指向同一件事：晋国的霸权正在瓦解。「政在私门」——政权落在卿大夫手中，这是三家分晋的前奏。弭兵之会（前 546）恰恰发生在这一背景下：对外的休战，与对内的权力下移同时进行。晋国之所以愿意弭兵，也与此有关——它在南方已无力与楚争。

id: xintangshu-xuanjuzhi
title: 新唐书
volume: 卷四十四·选举志上
author: 欧阳修、宋祁
composed: 约公元 1060 年
type: classic
quote: 唐制，取士之科，多因隋旧，然其大要有三：由学馆者曰生徒，由州县者曰乡贡，皆升于有司而进退之。其科之目，有秀才，有明经，有俊士，有进士，有明法，有明字，有明算，有一史，有三史，有开元礼，有道举，有童子。而明经之别，有五经，有三经，有二经，有学究一经，有三礼，有三传，有史科。此岁举之常选也。其天子自诏者曰制举，所以待非常之才焉。
note: 唐代科举的科目全表。要注意两点：一是「取士之科，多因隋旧」，明确承认科举源于隋；二是科目之多——明经、进士、明法、明字、明算之外还有史科、三礼、三传等，远不止「进士」一科。后世把科举等同于进士科，是简化的结果。「其天子自诏者曰制举，所以待非常之才」，说明除常科外还有制科，这一制度在唐代颇受重视，宋以后渐轻。

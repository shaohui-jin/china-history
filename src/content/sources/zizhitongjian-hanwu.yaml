id: zizhitongjian-hanwu
title: 资治通鉴
volume: 卷二十二·汉纪十四·征和二年
author: 司马光等
composed: 公元 1084 年
type: classic
quote: 太子之亡也，东至湖，藏匿泉鸠里。主人家贫，常卖屦以给太子。太子有故人在湖，闻其富赡，使人呼之而发觉。吏围捕太子，太子自度不得脱，即入室距户自经。……上既伤太子，乃下诏曰：「自今事有伤害太子者，朕弗忍闻。」……上怜太子无辜，乃作思子宫，为归来望思之台于湖。天下闻而悲之。
note: 《通鉴》对巫蛊之祸事后部分的记述。「主人家贫，常卖屦以给太子」——太子藏身之处的主人靠卖鞋供养他，这一细节让整个事件落到最具体的层面：一个做了三十年太子的男人，最后的日子靠一个卖鞋的穷人接济。「作思子宫，为归来望思之台于湖。天下闻而悲之」——悔悟来得太迟，但司马光仍记下了它。

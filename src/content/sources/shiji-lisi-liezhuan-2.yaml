id: shiji-lisi-liezhuan-2
title: 史记
volume: 卷八十七·李斯列传·沙丘之谋
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 高曰：「君侯自料能孰与蒙恬？功高孰与蒙恬？谋远不失孰与蒙恬？无怨于天下孰与蒙恬？长子旧而信之孰与蒙恬？」斯曰：「此五者皆不及蒙恬，而君责之何深也？」高曰：「……夫沙丘之谋，谋定矣。」斯乃仰天而叹，垂泪太息曰：「嗟乎！独遭乱世，既以不能死，安托命哉！」于是斯乃听高。
note: 沙丘之谋最完整的一手记载。「君侯自料能孰与蒙恬」五问，是赵高说服李斯的全部方法：不比道德，只比能力与处境。李斯承认「此五者皆不及蒙恬」，然后屈服。最后的「仰天而叹，垂泪太息」是司马迁给他留的一点体面——他知道自己在做什么，只是选择了活下去。此后的结局是「具五刑，腰斩咸阳市，夷三族」。

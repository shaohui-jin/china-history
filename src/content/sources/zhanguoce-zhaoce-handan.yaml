id: zhanguoce-zhaoce-handan
title: 战国策
volume: 赵策三·秦围赵之邯郸
author: 刘向辑
composed: 西汉末辑成，材料出战国
type: classic
quote: 秦围赵之邯郸。魏安釐王使将军晋鄙救赵。畏秦，止于荡阴，不进。魏王使客将军辛垣衍间入邯郸，因平原君谓赵王曰：「秦所以急围赵者，前与齐湣王争强为帝，已而复归帝，以齐故。今齐湣王已益弱，方今唯秦雄天下，此非必贪邯郸，其意欲求为帝。赵诚发使尊秦昭王为帝，秦必喜，罢兵去。」……鲁仲连曰：「彼秦者，弃礼义而上首功之国也，权使其士，虏使其民。彼则肆然而为帝，过而遂正于天下，则连有赴东海而死矣，吾不忍为之民也。」
note: 《战国策》记邯郸之围中的另一条线：魏王派辛垣衍游说赵国尊秦为帝以求罢兵，鲁仲连力斥之。这段与《史记·白起列传》的军事视角互补——一边是秦军为何攻不下，一边是合纵阵营内部的动摇。「彼秦者，弃礼义而上首功之国也」是战国时人对秦国最尖锐的定性，鲁仲连宁赴东海而死不为秦民，这一姿态成为此后两千年士人拒斥强权的原型。

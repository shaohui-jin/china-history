id: shiji-tianjingzhongwan
title: 史记
volume: 卷四十六·田敬仲完世家·威王
author: 司马迁
composed: 约公元前 91 年
quote: 威王曰：「此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。」于是乃朝诸县令长七十二人，赏一人，诛一人，奋兵而出。诸侯振惊，皆还齐侵地。威行三十六年。……齐威王之时，喜隐，好为淫乐长夜之饮，沉湎不治，委政卿大夫。百官荒乱，诸侯并侵，国且危亡，在于旦暮。左右莫敢谏。
note: 「一鸣惊人」的出处。淳于髡以大鸟为隐语讽谏，威王以此作答。此后「朝诸县令长七十二人，赏一人，诛一人」——用一次考察决定整个官僚体系的走向。司马迁的叙述把威王的转变写得极快：从「沉湎不治」到「威行三十六年」，中间只有一次整顿。这种加速叙述本身值得留意：它要的是「明君幡然醒悟」的效果，不是行政过程。

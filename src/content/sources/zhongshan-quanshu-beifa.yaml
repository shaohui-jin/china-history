id: zhongshan-quanshu-beifa
title: 孙中山全集
volume: 第九卷·北伐宣言、国事遗嘱
author: 孙中山
composed: 公元 1924 年
type: modern
quote: 余致力国民革命凡四十年，其目的在求中国之自由平等。积四十年之经验，深知欲达到此目的，必须唤起民众及联合世界上以平等待我之民族，共同奋斗。现在革命尚未成功，凡我同志，务须依照余所著《建国方略》、《建国大纲》、《三民主义》及《第一次全国代表大会宣言》，继续努力，以求贯彻。
note: 1925 年 3 月 12 日孙中山逝世前签署的国事遗嘱。「必须唤起民众及联合世界上以平等待我之民族」——这句话后来被概括为「联俄、联共、扶助农工」三大政策，成为国共合作的基础。孙中山去世时北伐尚未开始；北伐是他死后由国民党继续推动的事业。这份遗嘱因此成为北伐的合法性来源：谁继承遗嘱，谁就继承革命。

id: hanshu-wangmang-quyi
title: 汉书
volume: 卷八十四·王莽传上·居摄
author: 班固
composed: 约公元 82 年
quote: 于是群臣奏言：「莽虽有安宗庙之功，恐不足以当之，宜赐号安汉公。」……平帝崩，莽征宣帝玄孙婴儿广戚侯子婴，年二岁，托以为卜相最吉，立之。……群臣奏请莽居摄践阼，如周公故事。……翟义与刘宇、刘璜等谋曰：「新都侯摄天子位，号令天下，故择宗室幼稚者以为孺子，依讬周公辅成王之义，且以观望，必代汉家。」乃以九月都试日举兵，立刘信为天子，自号大司马柱天大将军，移檄郡国。
note: 王莽居摄与翟义起兵的关键记载。居摄的逻辑是「依讬周公辅成王之义」——用周公摄政的先例，让两岁的孺子婴当名义君主，自己行天子事。翟义看穿了这层伪装：「故择宗室幼稚者以为孺子……必代汉家。」他选在「九月都试日」起兵，因为那天郡国兵会集中，便于夺取兵权。这是一个精心选择的时机。

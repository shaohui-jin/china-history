id: songshi-yiwenzhi
title: 宋史
volume: 卷二百二至二百九·艺文志
author: 脱脱等
composed: 约公元 1345 年
type: classic
quote: 宋有天下，先后三百余年。……君臣上下，未尝顷刻不以文学为务。……太宗始置三馆，建秘阁，以藏书。真宗购求遗书，命写校，而秘府之藏，粲然大备。……板本之盛，于斯为极。
note: 《宋史·艺文志》序对宋代书籍状况的概括。「君臣上下，未尝顷刻不以文学为务」「板本之盛，于斯为极」——这两句话说明了活字印刷出现的社会条件：宋代是雕版印刷的第一个高峰，书籍的需求量与刻印规模都远超前代。毕昇的活字之所以可能出现，正是因为印刷已经成为成熟产业。但它也解释了为什么活字没有立即取代雕版：雕版的产业体系已经建立，活字要替代它，需要的是需求量的进一步增长。

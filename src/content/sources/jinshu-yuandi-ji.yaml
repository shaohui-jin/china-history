id: jinshu-yuandi-ji
title: 晋书
volume: 卷六·元帝纪
author: 房玄龄等
composed: 约公元 648 年
type: classic
quote: 永嘉初，用王导计，始镇建邺，以顾荣为军司马，贺循为参佐，王敦、王导、周顗、刁协并为腹心股肱，宾礼名贤，存问风俗，江东归心焉。……愍帝即位，进位丞相。……帝之发也，群臣攀号，或泣曰：「臣等不能效死，致社稷倾覆，今复弃陛下，其若宗庙何！」帝亦为之流涕。……太兴元年三月，帝即皇帝位，大赦，改元。
note: 东晋建立的核心记载。「用王导计，始镇建邺」——东晋的立国，起点是王导的一个建议。「宾礼名贤，存问风俗，江东归心焉」——十四个字说完了东晋立国的全部策略：礼遇江南士族，尊重地方风俗，换取他们的支持。这不是军事征服，是政治结盟。此后「王与马，共天下」的格局，在此已经定型。

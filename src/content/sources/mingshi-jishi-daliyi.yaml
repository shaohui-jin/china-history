id: mingshi-jishi-daliyi
title: 明史纪事本末
volume: 卷五十·大礼议
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 正德十六年四月，上入继大统。……议者谓宜考孝宗，而称兴献王为皇叔父。……进士张璁上疏曰：「继统不继嗣。……今陛下以兴献王之子入继大统，宜称兴献王为皇考，而孝宗为皇伯考。」帝得疏，大喜曰：「此论出，吾父子获全矣！」……自是议礼之臣，分为两派，攻讦不已，凡十七年而后定。
note: 大礼议的核心争议与结局。「继统不继嗣」——张璁这五个字是议礼派的理论武器：继承的是皇统，不是宗法上的父子关系。正德帝无子，嘉靖以藩王入继，按礼法应过继给孝宗；但张璁说，继统即可，不必改称生父为叔父。嘉靖得疏大喜：「此论出，吾父子获全矣！」这句话说明：大礼议表面是礼制之争，实质是嘉靖要保住自己的生父。「凡十七年而后定」——这场争论持续十七年。

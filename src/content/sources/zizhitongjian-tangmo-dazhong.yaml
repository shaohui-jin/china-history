id: zizhitongjian-tangmo-dazhong
title: 资治通鉴
volume: 卷二百四十八至二百四十九·唐纪·宣宗大中
author: 司马光等
composed: 公元 1084 年
quote: 宣宗性明察沉断，用法无私，从谏如流，重惜官赏，恭谨节俭，惠爱民物，故大中之政讫于唐亡，人思咏之，谓之小太宗。……上晚节颇好神仙，饵医官李玄伯、道士虞紫芝、山人王乐药，疽发于背。
note: 《通鉴》对「大中之治」的评价是全书对唐代君主少有的正面表述：「大中之政讫于唐亡，人思咏之，谓之小太宗。」司马光写作时距唐亡已近两百年，这个「人思咏之」反映的是后世对盛世的追念，也隐含着他自己的政治理想。末句「晚节颇好神仙」则把这位「小太宗」拉回现实——他与武宗一样死于丹药。

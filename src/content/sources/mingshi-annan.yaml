id: mingshi-annan
title: 明史
volume: 卷三百二十一·外国传二·安南
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 永乐四年，大军讨黎季犛，克之，获季犛父子，安南平。诏求陈氏后，无所得，乃置交阯都指挥使司、布政使司、按察使司，以尚书黄福掌之。……然安南初定，人心未附，简定、陈季扩相继叛。……宣德二年，诏罢交阯布政使司，召黄福等还。……自永乐四年至宣德二年，凡二十一年，三叛三定，终弃之。
note: 明朝征安南的完整过程。「自永乐四年至宣德二年，凡二十一年，三叛三定，终弃之」——这十六个字概括了明朝在安南的二十一年：出兵、设省、叛乱、再平、再叛，最后放弃。宣德二年（1427）撤兵，是明朝对外政策的一次重大转折：承认武力征服的边界。此后明朝对南方采取守势。

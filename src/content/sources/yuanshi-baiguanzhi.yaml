id: yuanshi-baiguanzhi
title: 元史
volume: 卷九十一·百官志七·行中书省
author: 宋濂等
composed: 约公元 1370 年
type: classic
quote: 行中书省，凡十，秩从一品。掌国庶务，统郡县，镇边鄙，与都省为表里。国初，有征伐之役，分任军民之事，皆称行省，未有定制。中统、至元间，始分立行中书省。……凡钱粮、兵甲、屯种、漕运、军国重事，无不领之。
note: 行省制的官方定义。「掌国庶务，统郡县，镇边鄙，与都省为表里」——行省是中央（都省，即中书省）的派出机构，但权力极大：「凡钱粮、兵甲、屯种、漕运、军国重事，无不领之」。这一制度的特殊性在于：它本是临时性的军事派出机构，却在元代固定为地方最高行政单位。明清的「省」制由此而来，中国的地方行政区划至今仍能看到它的痕迹。

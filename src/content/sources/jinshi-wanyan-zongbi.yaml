id: jinshi-wanyan-zongbi
title: 金史
volume: 卷七十七·完颜宗弼传
author: 脱脱等
composed: 约公元 1345 年
type: classic
quote: 宗弼自顺昌败归，遂入见，乞追封宗泽，又请以河南、陕西地与宋。……宗弼曰：「今若不取，后必为患。」遂复取河南。……兀术至郾城，飞遣子云领骑兵直贯其阵，戒之曰：「不胜，先斩汝！」鏖战数十合，贼尸布野。……兀术大恸曰：「自海上起兵，皆以此胜，今已矣！」遂还汴。
note: 郾城之战的金方记载。「兀术大恸曰：自海上起兵，皆以此胜，今已矣！」——金兀术以拐子马（重甲骑兵）横行多年，这一战却被岳飞以麻札刀砍马足破之。金史的这段记载，是岳飞武功最硬的旁证：敌方史书中承认了自己的失败。这一条比起《宋史·岳飞传》更有说服力，因为它出自对手一方。

id: houhanshu-nanxiongnu
title: 后汉书
volume: 卷八十九·南匈奴列传
author: 范晔
composed: 约公元 445 年
quote: 昭君字嫱，南郡人也。初，元帝时，以良家子选入掖庭。时呼韩邪来朝，帝敕以宫女五人赐之。昭君入宫数岁，不得见御，积悲怨，乃请掖庭令求行。呼韩邪临辞大会，帝召五女以示之。昭君丰容靓饰，光明汉宫，顾景裴回，竦动左右。帝见大惊，意欲留之，而难于失信，遂与匈奴。生二子。及呼韩邪死，其前阏氏子代立，欲妻之，昭君上书求归，成帝敕令从胡俗，遂复为后单于阏氏焉。
note: 这是「昭君自愿请行」说的源头，比《汉书》晚约三百六十年。范晔添加了《汉书》所无的几个关键情节：昭君「不得见御，积悲怨，乃请掖庭令求行」；临行时「丰容靓饰，光明汉宫」，元帝「见大惊，意欲留之，而难于失信」。这些细节把《汉书》的「赐」改写成了「请行」，把一个政治赏赐改写成了一段个人际遇。对照两书正是观察史书层累的最佳样本。

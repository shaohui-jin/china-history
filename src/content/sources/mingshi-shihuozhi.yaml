id: mingshi-shihuozhi
title: 明史
volume: 卷七十八·食货志二·赋役
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 一条鞭法者，总括一州县之赋役，量地计丁，丁粮毕输于官。一岁之役，官为佥募。力差，则计其工食之费，量为增减；银差，则计其交纳之费，加以增耗。凡额办、派办、京库岁需与存留、供用诸费，以及土贡方物，悉并为一条，皆计亩征银，折办于官，故谓之一条鞭。
note: 一条鞭法的标准定义。「总括一州县之赋役，量地计丁，丁粮毕输于官」——把原先分别征收的赋（田赋）、役（力役）、土贡（地方特产）合并为一条，按亩折银征收。三句话概括了全部改革：「一岁之役，官为佥募」（力役改为官府雇募）、「计亩征银」（实物与力役改为银）、「悉并为一条」（多项合并）。这三步的方向是一致的：把人身义务转化为货币义务，把多项征收合并为单一标准。

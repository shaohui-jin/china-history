id: shiji-fusu
title: 史记
volume: 卷六·秦始皇本纪
author: 司马迁
composed: 约公元前 91 年
quote: 始皇长子扶苏谏曰：「天下初定，远方黔首未集，诸生皆诵法孔子，今上皆重法绳之，臣恐天下不安。唯上察之。」始皇怒，使扶苏北监蒙恬于上郡。……高乃与公子胡亥、丞相斯阴谋破去始皇所封书赐公子扶苏者，而更诈为丞相斯受始皇遗诏沙丘，立子胡亥为太子。……扶苏为人仁，谓蒙恬曰：「父而赐子死，尚安复请！」即自杀。
note: 《秦始皇本纪》记扶苏谏坑术士、被遣上郡、矫诏赐死三事，是沙丘之变最原始的记载。「父而赐子死，尚安复请」一句，写出了扶苏之死的性格根源。

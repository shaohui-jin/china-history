id: xintangshu-shihuozhi
title: 新唐书
volume: 卷五十二·食货志二·两税法
author: 欧阳修、宋祁
composed: 约公元 1060 年
type: classic
quote: 自建中定两税，而物轻钱重，民以为患。至是四十年，当时为绢二匹半者为八匹，大率加三倍。豪家大商，积钱以逐轻重，故农人日困，末业日增。……盖自建中定税而物价之变，为患如此，其流至于后世，则又可知也。
note: 《新唐书·食货志》记两税法长期执行中的一个致命问题：钱重物轻。两税法规定以钱计税、折纳绢帛，但此后物价下跌，当初值二匹半绢的税额，四十年后要交八匹，实际负担增加了三倍。这一记载说明：两税法设计时的「以钱为准」，在货币短缺的时代会变成加税。「豪家大商，积钱以逐轻重，故农人日困」——钱荒的受益者是资本，受害者是农民。

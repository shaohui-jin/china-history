id: shiji-tiandan
title: 史记
volume: 卷八十二·田单列传·火牛阵
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 田单乃收城中得千余牛，为绛缯衣，画以五彩龙文，束兵刃于其角，而灌脂束苇于尾，烧其端。凿城数十穴，夜纵牛，壮士五千人随其后。牛尾热，怒而奔燕军，燕军夜大惊。牛尾炬火光明炫耀，燕军视之皆龙文，所触尽死伤。五千人因衔枚击之，而城中鼓噪从之，老弱皆击铜器为声，声动天地。燕军大骇，败走。齐人遂夷杀其将骑劫。
note: 火牛阵的标准文本。细节极具体：牛披绛缯、画五彩龙文、束兵刃于角、灌脂束苇于尾、凿城数十穴——这种详尽程度在先秦战事记载中罕见。司马迁写战争通常简省，此处却铺陈如此，说明这段材料来自一个已经高度文学化的传说。战果（破燕复齐）是史实，战法的具体情形则难以确证。读这段时值得留意：越是精彩的战术描述，越可能经过了流传中的修饰。

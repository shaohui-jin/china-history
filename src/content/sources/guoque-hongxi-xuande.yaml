id: guoque-hongxi-xuande
title: 国榷
volume: 卷十八至十九·洪熙、宣德
author: 谈迁
composed: 约公元 1653 年
type: classic
quote: 洪熙元年正月，上谕户部：「朕即位之初，宜加惠于民。天下田租，量减三分。」……宣德二年，诏罢交阯。……宣德五年，遣太监郑和等赍敕往谕西洋诸番国。……宣德十年正月，上崩于乾清宫。
note: 《国榷》记仁宣两朝的几件要事，与《明史》的记载可以对照。「洪熙元年正月，上谕户部：朕即位之初，宜加惠于民。天下田租，量减三分」——仁宗即位第一个月的减税，是他「休养」政策的具体开端。宣德二年罢交阯、五年第七次下西洋、十年崩——三年之内，三件大事。谈迁按年编排，把「治世」还原为一件件具体的事。

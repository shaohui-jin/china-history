id: xintangshu-choushiliang
title: 新唐书
volume: 卷二百七·宦者列传下·仇士良
author: 欧阳修、宋祁
composed: 约公元 1060 年
type: classic
quote: 士良等至，见幕下有伏兵，惊呼而走，挟帝入内。……士良率卫士五百人，露刃出东上阁门，逢人即杀，死者六七百人。……士良之归老也，其党送之，士良教之曰：「天子不可令闲，常宜以奢靡娱其耳目，使日新月盛，无暇更及他事，然后吾辈可以得志。慎勿使之读书，亲近儒生。彼见前代兴亡，心知忧惧，则吾辈疏斥矣。」
note: 《新唐书·宦者传》所记仇士良两段。「逢人即杀，死者六七百人」是甘露之变的官方记载。「天子不可令闲，常宜以奢靡娱其耳目……慎勿使之读书，亲近儒生」——这段话是唐代宦官政治的自白书，比任何分析都更直白。它说明宦官专权不靠暴力压制，靠的是垄断皇帝的注意力：不让皇帝读书，不让皇帝接近儒生，皇帝就不会知道前代兴亡，也就不会想到要除掉宦官。

id: kangri-zhanzheng-shi
title: 抗日战争史
volume: 第一卷·战争的起源与前期作战
author: 中国第二历史档案馆编
composed: 公元 1987 年
type: modern
quote: 民国二十六年七月七日，日军在卢沟桥附近演习，借口一名士兵失踪，要求进入宛平县城搜查，为中国守军拒绝。日军遂炮轰宛平城，中国守军第二十九军奋起抵抗。此即七七事变，中国全面抗战由此开始。
note: 中国大陆学界编纂的抗战史著作，依据档案整理。叙述极为克制，只记时间、地点、经过。「借口一名士兵失踪」——「借口」二字是编纂者的判断，说明失踪士兵并非真正的起因。这类档案汇编的价值在于它提供了未经文学化处理的事实序列，与回忆录、新闻报道互为参照。

id: beijing-xuesheng-jiexuan
title: 北京学界全体宣言
volume: 1919 年 5 月 4 日传单
author: 罗家伦起草
composed: 公元 1919 年 5 月
type: modern
quote: 现在日本在万国和会要求并吞青岛，管理山东一切权利，就要成功了！他们的外交大胜利了！我们的外交大失败了！山东大势一去，就是破坏中国的领土！中国的领土破坏，中国就亡了！所以我们学界今天排队游行，到各公使馆去，要求各国出来维持公理。务望全国工商各界，一律起来设法开国民大会，外争主权，内除国贼。中国存亡，就在此一举了！今与全国同胞立两个信条道：中国的土地可以征服而不可以断送！中国的人民可以杀戮而不可以低头！国亡了！同胞起来呀！
note: 五四当天散发的宣言，罗家伦起草。两个信条「中国的土地可以征服而不可以断送！中国的人民可以杀戮而不可以低头」是五四最广为传诵的句子。「外争主权，内除国贼」这八个字也出自此文，此后成为五四的纲领性口号。宣言针对的是巴黎和会关于山东问题的决定，全文没有一处提到文化或文学——这是政治诉求，不是文化运动。

id: lunheng-yuzeng
title: 论衡
volume: 卷七·语增篇
author: 王充
composed: 约公元 80 年
type: classic
quote: 传语曰：「秦始皇燔烧诗书，坑杀儒士。」言燔烧诗书，灭去五经文书也；坑杀儒士者，言其皆挟经传文书之人也。……夫言燔诗书，其实也；言坑儒士，增之也。……秦虽无道，不燔诸子；诸子尺书，文篇具在，可观读以正说，可采掇以示后人。
note: 王充对「坑儒」说的质疑，是中国最早的一篇「史料批判」。他承认焚书是真（「言燔诗书，其实也」），但认为「坑儒」被夸大了：「言坑儒士，增之也」——是增饰。他还指出一个事实：秦没有烧诸子书，「诸子尺书，文篇具在」。这一判断与《史记》「非博士官所职」的记载可以互证。王充的态度值得注意：他不是为秦辩护，而是认为叙述不该夸大——即使对象是公认的暴政。

id: houhanshu-banhao
title: 后汉书
volume: 卷四十七·班梁列传·班超
author: 范晔
composed: 约公元 445 年
quote: 超到鄯善，鄯善王广奉超礼敬甚备，后忽更疏懈。超谓其官属曰：「宁觉广礼意薄乎？此必有北虏使来，狐疑未知所从故也。」……超乃召侍胡诈之曰：「匈奴使来数日，今安在乎？」侍胡惶恐，具服其状。超乃闭侍胡，悉会其吏士三十六人，与共饮，激怒之曰：「卿曹与我俱在绝域，欲立大功以求富贵。今虏使到裁数日，而王广礼敬即废；如令鄯善收吾属送匈奴，骸骨长为豺狼食矣。为之奈何？」
note: 《班超传》是经营西域最完整的记载，三十六人夜袭匈奴使团的细节皆出此传。传末论「班超之志，可谓壮矣」。

id: houhanshu-yuanshao
title: 后汉书
volume: 卷七十四上·袁绍列传·官渡
author: 范晔
composed: 约公元 445 年
type: classic
quote: 绍为地道欲袭太祖营，太祖辄于内为长堑以拒之，又遣奇兵袭击绍运车，大破之，尽焚其谷。太祖与绍相持日久，百姓疲乏，多叛应绍，军食乏。……许攸进曰：「公孤军独守，外无救援，而粮谷已尽，此危急之日也。今袁氏辎重万余乘，在故市、乌巢，屯军无严备。若以轻兵袭之，不意而至，燔其积聚，不过三日，袁氏自败也。」……太祖乃留曹洪守，自将步骑五千，皆用袁军旗帜，衔枚缚马口，夜从间道出，人抱束薪。……琼等望见操兵少，悉众出阵，操急击，破之，遂焚其粮。
note: 《后汉书·袁绍传》所记官渡，与《三国志》互有详略。此本多出两个细节：一是「百姓疲乏，多叛应绍，军食乏」——说明曹操的处境同样濒危，胜负并非注定；二是许攸献计的完整理由，以及曹操「皆用袁军旗帜，衔枚缚马口」的伪装细节。两书对乌巢焚粮这一决胜环节完全一致，但《后汉书》更强调曹操当时的困境。

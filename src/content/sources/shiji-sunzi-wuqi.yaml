id: shiji-sunzi-wuqi
title: 史记
volume: 卷六十五·孙子吴起列传
author: 司马迁
composed: 约公元前 91 年
quote: 孙武既死，后百馀岁有孙膑。……魏伐赵，赵急，请救于齐。齐威王欲将孙膑，膑辞谢曰：「刑馀之人不可。」于是乃以田忌为将，而孙子为师，居辎车中，坐为计谋。田忌欲引兵之赵，孙子曰：「夫解杂乱纷纠者不控卷，救斗者不搏撠，批亢捣虚，形格势禁，则自为解耳。今梁赵相攻，轻兵锐卒必竭于外，老弱罢于内。君不若引兵疾走大梁，据其街路，冲其方虚，彼必释赵而自救。是我一举解赵之围而收弊于魏也。」田忌从之，魏果去邯郸，与齐战于桂陵，大破梁军。
note: 「围魏救赵」的原始文本。「批亢捣虚，形格势禁」八字是这套战法的理论概括：避开敌人坚实处，打击其空虚处；形势一旦被牵制，围自然解开。后段记马陵之战，孙膑「减灶」诱庞涓深入，庞涓自刎前曰「遂成竖子之名」。

id: mingshi-jishi-anda
title: 明史纪事本末
volume: 卷六十·俺答封贡
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 隆庆四年冬十月，俺答孙把汉那吉率其属阿力哥等十人来降。……时内阁高拱、张居正力主抚纳。……五年三月，封俺答为顺义王，赐之金印。……自是边境休宁，迄今数十年，无烽火之警。……论者谓：和戎之利，于是为最。
note: 《明史纪事本末·俺答封贡》的记载与评论。末句「论者谓：和戎之利，于是为最」——谷应泰对封贡的评价是正面的：在所有「和戎」（与少数民族和好）的案例中，这一次收益最大。这一判断与当时朝中「城下之盟」的批评相反。「自是边境休宁，迄今数十年，无烽火之警」——数十年无战事，是这项政策最实在的成效。

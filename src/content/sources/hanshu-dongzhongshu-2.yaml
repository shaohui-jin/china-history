id: hanshu-dongzhongshu-2
title: 汉书
volume: 卷五十六·董仲舒传·赞
author: 班固
composed: 约公元 82 年
quote: 刘向称「董仲舒有王佐之材，虽伊吕亡以加，筦晏之属，伯者之佐，殆不及也」。至向子歆以为「伊吕乃圣人之耦，王者不得则不兴。故颜渊死，孔子曰『噫！天丧余』。唯此一人为能当之，自宰我、子赣、子游、子夏不与焉。仲舒遭汉承秦灭学之后，六经离析，下帷发愤，潜心大业，令后学者有所统壹，为群儒首」。
note: 班固引用刘向、刘歆父子的两代评价：刘向许以「王佐之材」，刘歆则降一等，只承认其「为群儒首」。这一分歧本身说明董仲舒的历史定位在当时即有争议。

id: mingshi-gongdan
title: 明史
volume: 卷三百二十七·外国传八·鞑靼
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 隆庆四年，把汉那吉来降。……把汉那吉者，俺答第三子铁背台吉之子也，幼孤，育于俺答妻一克哈屯所。……（高拱、张居正）议：不如因而抚之，以结俺答之心。……五年三月，诏封俺答为顺义王，赐印信，改名王崇古。……其弟昆都力哈、子黄台吉等各授都督同知、指挥使有差。……始议开马市于大同、宣府、山西三镇。
note: 俺答封贡的完整记载。「不如因而抚之，以结俺答之心」——明廷的决策逻辑：不杀降人，以此作为与俺答谈判的契机。「诏封俺答为顺义王，赐印信，改名王崇古」——赐印、改名，是册封的形式。「始议开马市于大同、宣府、山西三镇」——封贡的核心是贸易，不是名分。这一段把「和议」的实际内容说清楚了。

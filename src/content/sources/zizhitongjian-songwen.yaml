id: zizhitongjian-songwen
title: 资治通鉴
volume: 卷一百二十五·宋纪七·元嘉二十七年
author: 司马光等
composed: 公元 1084 年
type: classic
quote: 魏主自将步骑十万南寇，……所过郡县，望风奔溃。……盱眙太守沈璞、辅国将军臧质守盱眙，魏人攻之不克。……魏人凡破南兖、徐、兖、豫、青、冀六州，杀掠不可胜计。丁壮者即加斩截，婴儿贯于槊上，盘舞以为戏。所过郡县，赤地无余。春燕归，巢于林木。
note: 元嘉二十七年北伐惨败的记载，是「元嘉草草」的原始出处。「丁壮者即加斩截，婴儿贯于槊上，盘舞以为戏」——辛弃疾后来写「元嘉草草，封狼居胥，赢得仓皇北顾」，指的就是这一段。「春燕归，巢于林木」——春天燕子回来，找不到人家的屋檐，只能在树林里筑巢。这一句比任何数字都更能说明破坏的程度。

id: shiji-xiaojing-benji
title: 史记
volume: 卷十一·孝景本纪
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 孝景皇帝者，孝文之中子也。母窦太后。孝文在代时，前后有三男，及窦太后得幸，前后死，及三子更死，故孝景得立。……三年正月乙巳，赦天下。长星出西方。天火燔雒阳东宫大殿城室。吴王濞、楚王戊、赵王遂、胶西王卬、济南王辟光、菑川王贤、胶东王雄渠反，发兵西乡。天子为诛晁错，遣袁盎谕告，不止，遂西围梁。上乃遣大将军窦婴、太尉周亚夫将兵诛之。
note: 《孝景本纪》对七国之乱的记载极简，六十五字说完全过程。司马迁写《景帝本纪》历来被认为篇幅偏短、内容偏简，与他写文帝、武帝的详略形成对比。有学者认为今本《孝景本纪》已有残缺。但正是这种简省，让「天子为诛晁错」五个字格外刺眼——杀一个大臣，只用了五个字。

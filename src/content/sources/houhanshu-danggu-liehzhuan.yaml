id: houhanshu-danggu-liehzhuan
title: 后汉书
volume: 卷六十七·党锢列传
author: 范晔
composed: 约公元 445 年
quote: 桓灵之间，君荒政缪，国命委于阉寺，士子羞与为伍，故匹夫抗愤，处士横议，遂乃激扬名声，互相题拂，品核公卿，裁量执政，婞直之风，于斯行矣。……凡党事始自甘陵、汝南，成于李膺、张俭，海内涂炭，二十余年，诸所蔓衍，皆天下善士。
note: 《党锢列传》的序论，是理解党锢之祸的关键。「匹夫抗愤，处士横议……品核公卿，裁量执政」——士人用清议批评朝政，形成了一股独立于朝廷的舆论力量。这正是宦官要镇压他们的原因：不是因为他们谋反，而是因为他们「品核公卿」。「海内涂炭，二十余年」是范晔对此事的总结。

id: qingshigao-wenzong
title: 清史稿
volume: 卷二十·文宗本纪
author: 赵尔巽等
composed: 约公元 1928 年
type: classic
quote: 十年秋七月，英、法兵陷大沽，遂入天津。……八月，英法兵犯通州，僧格林沁败绩于八里桥。……上幸热河。……是月，英法兵入京师，焚圆明园。……九月，奕䜣与英法议和，成《北京条约》。……十一年秋七月，上崩于热河行宫。
note: 《清史稿·文宗本纪》对第二次鸦片战争的记载。与《筹办夷务始末》的档案相比，本纪的叙述更简，但保持了官方的立场：「上幸热河」——同样是「幸」。「英法兵入京师，焚圆明园」——这一句是《清史稿》对圆明园被焚的唯一记载，没有任何评述。此后咸丰帝崩于热河，再未回京。

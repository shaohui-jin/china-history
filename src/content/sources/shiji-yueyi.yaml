id: shiji-yueyi
title: 史记
volume: 卷八十·乐毅列传·报燕惠王书
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 臣闻贤圣之君不以禄私亲，其功多者赏之，其能当者处之。故察能而授官者，成功之君也；论行而结交者，立名之士也。……臣窃观先王之举错，有高世主之心，故假节于魏，以身得察于燕。先王过举，厕之宾客之中，立之群臣之上，不谋父兄，以为亚卿。臣窃不自知，自以为奉令承教，可幸无罪，故受令而不辞。……善作者不必善成，善始者不必善终。
note: 「善作者不必善成，善始者不必善终」的出处，出自乐毅《报燕惠王书》。乐毅破齐七十余城，只剩莒、即墨二城未下，燕惠王即位后中田单反间计，以骑劫代之，乐毅奔赵。这封信是他回应惠王责难的自辩，也是先秦散文的名篇。信中最能自持的一句是「善作者不必善成，善始者不必善终」——把功败垂成归因于时势与用人，而非自己的能力。

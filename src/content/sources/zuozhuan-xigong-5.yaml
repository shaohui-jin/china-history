id: zuozhuan-xigong-5
title: 左传
volume: 僖公二年、五年·晋假道于虞以伐虢
author: 相传左丘明撰
composed: 战国前期
quote: 晋荀息请以屈产之乘与垂棘之璧，假道于虞以伐虢。公曰：「是吾宝也。」对曰：「若得道于虞，犹外府也。」……宫之奇谏曰：「虢，虞之表也。虢亡，虞必从之。晋不可启，寇不可玩。一之谓甚，其可再乎？谚所谓『辅车相依，唇亡齿寒』者，其虞、虢之谓也。」……冬十二月丙子朔，晋灭虢，虢公丑奔京师。师还，馆于虞，遂袭虞，灭之。
note: 「唇亡齿寒」的出处。晋献公以良马美璧贿赂虞公，两次借道伐虢；虞大夫宫之奇两次谏阻，虞公不听。晋灭虢后回师途中顺道灭虞——「假道」的终局，从来不是只有去路。《左传》记事至此收束得极冷：一句「遂袭虞，灭之」，不加评断。

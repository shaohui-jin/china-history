id: zhanguoce-weice
title: 战国策
volume: 魏策一·魏武侯与诸大夫浮于西河
author: 刘向辑
composed: 西汉末辑成，材料出战国
quote: 魏武侯与诸大夫浮于西河，称曰：「河山之险，岂不亦信固哉！」王钟侍王，曰：「此晋国之所以强也。若善修之，则霸王之业具矣。」吴起对曰：「吾君之言，危国之道也；而子又附之，是危也。」武侯忿然曰：「子之言有说乎？」吴起对曰：「河山之险，信不足保也；是伯王之业，不从此也。」
note: 吴起论「在德不在险」的出处。魏武侯以山河之险为固，吴起历数三苗、桀、纣之亡，都在于「政不修」「为政不善」，最后一句「若君不修德，舟中之人尽为敌国也」是战国政治思想中最锋利的一句。这段与《史记·吴起列传》所记大同小异，后者作「在德不在险」。

id: mingshi-jishi-gengxu
title: 明史纪事本末
volume: 卷五十九·庚戌之变
author: 谷应泰
composed: 约公元 1658 年
type: classic
quote: 嘉靖二十九年八月，俺答自独石边入犯，由古北口入，掠通州，遂薄都城。……时京城戍卒仅四五万，而老弱半之。……上命咸宁侯仇鸾为平虏大将军，率诸道兵御之。鸾畏虏，不敢战，乃上与虏约，赂以金币，令东行。……虏既退，鸾奏功，加太保。……时谓「庚戌之变」。
note: 庚戌之变的记载。三个要点：一是明军的实况，「京城戍卒仅四五万，而老弱半之」；二是主将的怯懦，「鸾畏虏，不敢战，乃上与虏约，赂以金币，令东行」——用贿赂让敌人走，然后报功；三是「虏既退，鸾奏功，加太保」——一场几乎导致首都陷落的危机，最后以主将升官结束。这一段把明中期的军事废弛与政治虚饰写尽了。

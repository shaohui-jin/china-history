id: yuandianzhang-xingsheng
title: 元典章
volume: 朝纲·中书省·行省
author: 元代官修
composed: 约公元 1322 年
type: classic
quote: 行省官每遇疑难重事，须与都省商议，不得专决。……诸行省凡有军情紧急，许一面调遣，一面飞报都省。……行省所辖路府州县，凡官吏考选、钱粮征纳、刑名词讼，皆隶焉。
note: 《元典章》是元代法令与公文的汇编，比《元史》更接近制度实际运作的层面。这三条把行省的实际权限说得很清楚：疑难重事须与都省商议（不能专决）、军情紧急可一面调遣一面飞报（有临机处置权）、路府州县的考选钱粮刑名皆归其管辖（是实际的地方主管）。一边限制独断，一边授予实权，这一平衡正是行省制的设计要点。

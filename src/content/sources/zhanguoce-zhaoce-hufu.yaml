id: zhanguoce-zhaoce-hufu
title: 战国策
volume: 赵策二·武灵王平昼闲居
author: 刘向辑
composed: 西汉末辑成，材料出战国
quote: 武灵王平昼闲居，肥义侍坐，曰：「王虑世事之变，权甲兵之用，念简、襄之迹，计胡、狄之利乎？」……王曰：「夫有高世之功者，必负遗俗之累；有独知之虑者，必被庶人之恐。今吾将胡服骑射以教百姓，而世必议寡人矣。」
note: 《战国策》所记武灵王与肥义的对话，比《史记》更完整地保留了决策前的心理活动：「有高世之功者，必负遗俗之累；有独知之虑者，必被庶人之恐。」——想做超出时代的事，必然背负违背习俗的罪名；有独到的见识，必然遭到众人的非议。这不是修辞，是一个改革者在动手前对代价的预判。

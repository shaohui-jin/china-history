id: shiji-zhao-shijia
title: 史记
volume: 卷四十三·赵世家·武灵王
author: 司马迁
composed: 约公元前 91 年
quote: 王曰：「夫服者，所以便用也；礼者，所以便事也。圣人观乡而顺宜，因事而制礼，所以利其民而厚其国也。……乡异而用变，事异而礼易。是以圣人果可以利其国，不一其用；果可以便其事，不同其礼。」……遂胡服骑射以教百姓。
note: 《赵世家》记武灵王胡服骑射的辩论，是全书中最精彩的说理段落之一。「服者所以便用也，礼者所以便事也」——把服制与礼制都还原为「工具」，只问是否便用、便事，不问是否合乎旧俗。这一论证方式在此后两千年的改革话语中被反复借用，从商鞅到戊戌变法都能看到它的影子。

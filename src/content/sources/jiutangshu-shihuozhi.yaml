id: jiutangshu-shihuozhi
title: 旧唐书
volume: 卷四十八·食货志上·租庸调
author: 刘昫等
composed: 约公元 945 年
type: classic
quote: 凡赋役之制有四：一曰租，二曰调，三曰役，四曰杂徭。课户每丁租粟二石。其调随乡土所产绫、绢、絁各二丈，布加五分之一。输绫、绢、絁者，绵三两；输布者，麻三斤。凡丁，岁役二旬；若不役，则收其佣，每日三尺。有事而加役者，旬有五日免其调，三旬则租调俱免。通正役，并不过五十日。
note: 租庸调制的标准表述。「庸」这一项最值得注意：「凡丁，岁役二旬；若不役，则收其佣，每日三尺。」——劳役可以用绢帛折代。这不是简单的减免，而是把人身劳役转化为可计算的货币（实物）义务。这一转化在制度史上的意义极大：它使国家的征发不再依赖对人身直接控制，为此后两税法的「以资产为宗」铺了路。

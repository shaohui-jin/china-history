id: shiji-jin-shijia-3
title: 史记
volume: 卷三十九·晋世家·献公
author: 司马迁
composed: 约公元前 91 年
quote: 十九年，献公私谓骊姬曰：「吾欲废太子，以奚齐代之。」骊姬泣曰：「太子之立，诸侯皆已知之，而数将兵，百姓附之，奈何以贱妾之故废適立庶？」……献公病，属奚齐于荀息。……献公卒，里克、邳郑欲纳文公，故以三公子之徒作乱。
note: 《晋世家》记献公晚年两件大事：废嫡立庶、假道伐虢。两件事在司马迁的叙述里是同一条线的两端——对外以诈术取虞虢，对内以私爱乱宗法。献公一死，里克作乱，奚齐、卓子相继被杀，晋国大乱近二十年，直到重耳归国。

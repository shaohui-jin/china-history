id: shiji-pingyuan-jun
title: 史记
volume: 卷七十六·平原君虞卿列传·邯郸之围
author: 司马迁
composed: 约公元前 91 年
type: classic
quote: 秦之围邯郸，赵使平原君求救，合从于楚。……平原君曰：「使文能取胜，则善矣；文不能取胜，则歃血于华屋之下，必得定从而还。士不外索，取于食客门下足矣。」得十九人，余无可取者，无以满二十人。门下有毛遂者，前，自赞于平原君曰：「遂闻君将合从于楚，约与食客门下二十人偕，不外索。今少一人，愿君即以遂备员而行矣。」……毛遂曰：「臣乃今日请处囊中耳。使遂蚤得处囊中，乃颖脱而出，非特其末见而已。」
note: 「毛遂自荐」与「脱颖而出」的出处。这段文字的价值在于它记录了邯郸之围中赵国的外交困境：兵临城下，只能靠求援。平原君选二十人随行，选到十九人便「余无可取者」——一个号称养士数千的贵族，紧要关头挑不出第二十个可用之人。毛遂的自荐，恰是对这套养士制度的一次反讽：真正的才士在门下三年，无人识得。

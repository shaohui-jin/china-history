id: taofen-yanlun-hongxian
title: 韬奋政论选
volume: 对于国体问题的讨论
author: 邹韬奋
composed: 公元 1930 年代
type: modern
quote: 袁世凯以总统而称帝，前后不过八十余日。他之所以失败，不是因为他的实力不够，而是因为他误判了时代。民国虽已成立，但共和的观念，已在一般国民心中生了根。凡逆此潮流者，无论其力多强，终必失败。
note: 邹韬奋对袁世凯称帝的评论，代表了三四十年代知识界的通行判断。「他之所以失败，不是因为他的实力不够，而是因为他误判了时代」——袁世凯手握北洋重兵，实力是足够的；但他没有意识到：民国建立之后，共和已经成为一个不可逆的合法性标准。凡逆此潮流者，终必失败。这一判断对此后的历史也有解释力。

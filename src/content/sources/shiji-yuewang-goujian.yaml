id: shiji-yuewang-goujian
title: 史记
volume: 卷四十一·越王句践世家
author: 司马迁
composed: 约公元前 91 年
quote: 吴既赦越，越王句践反国，乃苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆也。曰：「女忘会稽之耻邪？」身自耕作，夫人自织，食不加肉，衣不重采，折节下贤人，厚遇宾客，振贫吊死，与百姓同其劳。
note: 「卧薪尝胆」的原始文本其实是「置胆于坐」——尝胆确有其事，「卧薪」是后世（宋代以后）才加上的。这一细节值得留意：一个成语的形成，往往经历了数百年的层累。原文里更值得注意的是后半段：身自耕作、夫人自织、食不加肉、折节下贤人——勾践的复兴不靠谋略，靠的是把国君降到与民同等的生活水平。

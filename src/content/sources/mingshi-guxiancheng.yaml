id: mingshi-guxiancheng
title: 明史
volume: 卷二百三十一·顾宪成传
author: 张廷玉等
composed: 约公元 1739 年
type: classic
quote: 顾宪成，字叔时，无锡人。……（万历）二十二年，忤帝意，削籍归。……宪成既废，讲学东林书院，偕同志高攀龙、钱一本、薛敷教、史孟麟、于孔兼辈，讲习其中，学者称泾阳先生。……当是时，士大夫抱道忤时者，率退处林野，闻风响附，学舍至不能容。……其讲习之余，往往讽议朝政，裁量人物。朝士慕其风者，多遥相应和。由是东林名大著，而忌者亦多。
note: 东林党的源起。「宪成既废，讲学东林书院」——一个被罢官的士人，回乡讲学，吸引了「抱道忤时者」。「其讲习之余，往往讽议朝政，裁量人物」——这句话是东林党的实质：一个讲学的书院，成了批评朝政的舆论中心。「朝士慕其风者，多遥相应和。由是东林名大著，而忌者亦多」——名声越大，敌人越多。东林党争的种子，在这里就埋下了。

id: yuanchao-mishi
title: 元朝秘史
volume: 卷一·帖木真称汗
author: 佚名（蒙古文原著，明代汉译）
composed: 约公元 1240 年成书，明代汉译
type: classic
quote: 那夜，帖木真、札木合两个同处。次日，帖木真、札木合二人商量：「俺两个同处，教谁做头？」……众部落的人马，共立帖木真做了皇帝，号成吉思汗。……成吉思汗既做了皇帝，将那百姓每整治了，教百姓每得安。
note: 《元朝秘史》是蒙古人自己写的开国史，与《元史》的汉文官修史视角完全不同。「那夜，帖木真、札木合两个同处。次日，帖木真、札木合二人商量：俺两个同处，教谁做头？」——这种接近口语的对话，在汉文史书里看不到。它记录的是一次真实的权力协商，而不是「天命所归」。《元史·太祖本纪》说「帝深沉有大略，用兵如神」，这里只说「众人共立」，两种叙述的差别，就是官修正史与部族记忆的差别。

id: mingji-beilue-yuanchonghuan
title: 明季北略
volume: 卷五·袁崇焕之死
author: 计六奇
composed: 约公元 1670 年
type: classic
quote: 崇焕之入援也，诏许以便宜行事。……及入见，帝慰劳甚至，咨以战守之策。崇焕对曰：「五年全辽可复。」……及平台召对，帝问以复辽方略，崇焕遽曰：「五年为期。」给事中许誉卿叩之，崇焕曰：「圣心焦劳，聊以是相慰耳。」誉卿曰：「上英明，安可漫对？异日按期责功，奈何？」崇焕自失。……后竟以「擅主和议、专戮大帅」罪，磔于市。
note: 《明季北略》记袁崇焕之死。「五年全辽可复」——这个承诺是他一生的转折点。计六奇记许誉卿问他，他答「圣心焦劳，聊以是相慰耳」——原来只是安慰皇帝的话。而许誉卿立刻指出问题：「上英明，安可漫对？异日按期责功，奈何？」「崇焕自失」——他自己也知道这句话闯了祸。最终以「擅主和议、专戮大帅」罪被凌迟处死，这是明末最惨烈的一桩冤案。

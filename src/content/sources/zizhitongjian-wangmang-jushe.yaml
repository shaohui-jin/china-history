id: zizhitongjian-wangmang-jushe
title: 资治通鉴
volume: 卷三十六·汉纪二十八·平帝元始五年至王莽始初元年
author: 司马光等
composed: 公元 1084 年
quote: 翟义乃与东郡都尉刘宇、严乡侯刘信、信弟武平侯刘璜结谋，以九月都试日斩观令，因勒其车骑材官士，募郡中勇敢，部署将帅。义自号大司马柱天大将军，立刘信为天子，移檄郡国，言「莽鸩杀孝平皇帝，摄天子位，欲绝汉室。今共行天罚，诛莽」。
note: 《资治通鉴》对翟义起兵的记载，取自《汉书》但重新组织过。值得注意的是它把「九月都试日」这个时间选择写得更清楚：都试是汉代郡国每年九月检阅军队的制度，翟义选在这一天动手，是因为可以借检阅之机直接控制郡国兵——这是汉代兵制赋予叛乱者的制度性机会。司马光保留了「鸩杀孝平皇帝」的指控，未加辨正，说明宋代史家对此仍持存疑态度。
